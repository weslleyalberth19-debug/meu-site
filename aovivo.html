<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Configurações PWA e Tela Inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aovivo">
    <title>Aovivo - Futebol Live</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #161618;
            --surface-hover: #222226;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --live-red: #ff3b30;
            --live-red-glow: rgba(255, 59, 48, 0.4);
            --radius-card: 16px;
            --radius-pill: 12px;
            --modal-bg: rgba(22, 22, 25, 0.92);
            --header-bg: rgba(0, 0, 0, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-hover: rgba(255, 255, 255, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 60px; }

        /* Tela de Abertura */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #splashScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-logo { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; color: #fff; margin-bottom: 14px; text-transform: uppercase; }
        .splash-logo span { color: var(--live-red); }
        .splash-spinner { width: 24px; height: 24px; border: 2px solid rgba(255,59,48,0.2); border-top-color: var(--live-red); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Cabeçalho */
        header {
            padding: 18px 22px;
            background: var(--header-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--border-glass);
        }
        .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-primary); cursor: pointer; text-transform: uppercase; }
        .brand span { color: var(--live-red); }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-switch-universe {
            background: var(--surface-color);
            border: 0.5px solid var(--border-glass);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            white-space: nowrap;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-switch-universe:hover { background: var(--surface-hover); border-color: var(--border-glass-hover); }

        .search-box {
            background: var(--surface-color);
            border: 0.5px solid var(--border-glass);
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 125px;
            transition: width 0.3s cubic-bezier(0.15, 0.85, 0.35, 1.2), border-color 0.2s;
        }
        .search-box:focus { width: 180px; border-color: var(--live-red); }

        /* Abas de Navegação */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border-bottom: 0.5px solid var(--border-glass);
            padding: 0 22px;
        }
        .filter-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 14px 0;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-chip {
            background: var(--surface-color);
            border: 0.5px solid var(--border-glass);
            color: var(--text-secondary);
            padding: 7px 16px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-chip.active {
            background: #fff;
            color: #000;
            font-weight: 700;
            border-color: #fff;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }

        /* Container Principal */
        .container { padding: 28px 22px; flex: 1; display: flex; flex-direction: column; gap: 34px; }

        /* Secções */
        .category-section { width: 100%; }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px;
        }
        .category-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-primary);
        }
        .btn-see-more {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .btn-see-more:hover { color: #fff; }

        /* Carrossel de Canais */
        .matches-carousel {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
            align-items: flex-start;
        }
        .matches-carousel::-webkit-scrollbar { display: none; }

        /* Card de Canal */
        .match-card {
            background: transparent;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            flex: 0 0 160px;
            width: 160px;
            transition: transform 0.25s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }
        @media (min-width: 768px) { .match-card { flex: 0 0 190px; width: 190px; } }
        .match-card:hover { transform: translateY(-4px); }
        .match-card:active { transform: scale(0.96); }

        .poster-wrapper {
            width: 100%;
            aspect-ratio: 16 / 10 !important;
            border-radius: var(--radius-card);
            overflow: hidden;
            background: var(--surface-color);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 0.5px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            transition: border-color 0.2s;
        }
        .match-card:hover .poster-wrapper { border-color: var(--border-glass-hover); }

        .match-logo {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
            position: absolute !important;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }

        .live-badge {
            position: absolute;
            top: 8px; left: 8px;
            background: var(--live-red);
            color: #fff;
            font-size: 8px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 6px;
            z-index: 3;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 2px 10px var(--live-red-glow);
        }

        .quality-badge {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 8px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 6px;
            z-index: 3;
            letter-spacing: 0.5px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        .match-details { margin-top: 10px; padding: 0 2px; }
        .match-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
        }
        .match-sub {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Grelha para Listas */
        .matches-grid-wrapper { display: flex; justify-content: center; width: 100%; }
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            width: 100%;
        }
        @media (min-width: 768px) { .matches-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; } }

        .list-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .btn-back {
            background: var(--surface-color);
            border: 0.5px solid var(--border-glass);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-back:hover { background: var(--surface-hover); }

        /* Modal */
        .detail-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            display: flex;
            align-items: flex-end;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        @media (min-width: 768px) { .detail-overlay { align-items: center; justify-content: center; } }
        .detail-overlay.active { opacity: 1; pointer-events: auto; }
        .detail-card {
            background: var(--modal-bg);
            border-top: 0.5px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-height: 85vh;
            border-radius: 28px 28px 0 0;
            padding: 32px 24px;
            overflow-y: auto;
            box-shadow: 0 -25px 70px rgba(0,0,0,0.95);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @media (min-width: 768px) { .detail-card { width: 440px; border-radius: 28px; transform: scale(0.92); } }
        .detail-overlay.active .detail-card { transform: translateY(0); }
        @media (min-width: 768px) { .detail-overlay.active .detail-card { transform: scale(1); } }

        .detail-header { display: flex; gap: 18px; margin-bottom: 22px; align-items: center; }
        .detail-poster { width: 115px; aspect-ratio: 16/10; border-radius: 12px; object-fit: contain; background: var(--surface-color); padding: 12px; border: 0.5px solid var(--border-glass); }
        .detail-meta { display: flex; flex-direction: column; justify-content: center; flex: 1; gap: 3px; }
        .detail-title { font-size: 19px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.3px; }
        .detail-category-tag { font-size: 11px; color: var(--live-red); text-transform: uppercase; font-weight: 800; letter-spacing: 0.6px; }
        
        .vlc-notice { background: rgba(255,255,255,0.04); border: 0.5px solid var(--border-glass); padding: 14px 16px; border-radius: 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.45; }
        .detail-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-play-vlc { background: #fff; color: #000; border: none; padding: 16px; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; display: block; text-transform: uppercase; letter-spacing: 0.6px; box-shadow: 0 4px 20px rgba(255,255,255,0.25); }
        .btn-play-vlc:active { transform: scale(0.97); }
        .btn-favorite-toggle { background: var(--surface-color); color: var(--text-primary); border: 0.5px solid var(--border-glass); padding: 13px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-close-detail { background: transparent; color: var(--text-secondary); border: none; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }

        .empty-catalog-box { background: var(--surface-color); border: 0.5px solid var(--border-glass); border-radius: 20px; padding: 40px 24px; max-width: 400px; text-align: center; margin: 40px auto; box-shadow: 0 15px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px; }
        .status-message { text-align: center; color: var(--text-secondary); padding: 40px; font-size: 13px; width: 100%; }
    </style>
</head>
<body>

    <!-- Tela de Abertura -->
    <div id="splashScreen">
        <div class="splash-logo">Futebol<span>Live</span></div>
        <div class="splash-spinner"></div>
    </div>

    <!-- Cabeçalho -->
    <header>
        <div class="brand" onclick="voltarHome()">Futebol<span>Live</span></div>
        <div class="header-actions">
            <a href="index.html" class="btn-switch-universe">FreeTV</a>
            <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar..." oninput="dispararBuscaComDelay()">
        </div>
    </header>

    <!-- Abas -->
    <div class="filter-bar">
        <div class="filter-tabs" id="filterTabs">
            <div class="tab-chip active" onclick="filtrarPorAba('Todos')">Início</div>
            <div class="tab-chip" onclick="filtrarPorAba('Favoritos')">Favoritos (<span id="favCount">0</span>)</div>
            <div class="tab-chip" onclick="filtrarPorAba('Historico')">Recentes</div>
        </div>
    </div>

    <!-- Container Principal -->
    <div class="container" id="mainContainer">
        <div class="status-message">A carregar interface...</div>
    </div>

    <!-- Modal de Transmissão -->
    <div class="detail-overlay" id="detailModal" onclick="fecharDetalhesFora(event)">
        <div class="detail-card" id="detailCard">
            <div class="detail-header">
                <img id="detCapa" class="detail-poster" src="" alt="Logo">
                <div class="detail-meta">
                    <div class="detail-category-tag" id="detCategoria">AO VIVO</div>
                    <div class="detail-title" id="detTitulo">Canal</div>
                    <div id="detQualidadeBadge" style="font-size: 11px; color: var(--live-red); font-weight: 800;">● SINAL EM DIRETO</div>
                </div>
            </div>
            <div class="vlc-notice">
                ⚠️Toque abaixo para abrir o sinal de vídeo diretamente no leitor VLC instalado no seu dispositivo.
            </div>
            <div class="detail-actions">
                <a id="btnAssistir" href="#" class="btn-play-vlc" onclick="salvarHistoricoAtivo()">Assistir no VLC</a>
                <button id="btnFav" class="btn-favorite-toggle" onclick="toggleFavoritoAtual()">Adicionar aos Favoritos</button>
                <button class="btn-close-detail" onclick="fecharDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let listaCanais = [];
        let categoriasMap = {};
        let favoritos = JSON.parse(localStorage.getItem('futebol_favs')) || [];
        let historicoLista = JSON.parse(localStorage.getItem('futebol_history_list')) || [];
        let canalSelecionado = null;
        let tempoBusca = null;
        let abaAtiva = 'Todos';

        async function carregarCanais() {
            try {
                const response = await fetch('futebol.json');
                const dadosJson = await response.json();
                
                if (dadosJson.channels && Array.isArray(dadosJson.channels)) {
                    listaCanais = dadosJson.channels.map(item => {
                        let categoria = item.group || (item.attributes && item.attributes['group-title']) || "Canais Esportivos";
                        let capa = (item.attributes && item.attributes['tvg-logo']) || "";
                        let nome = item.name || "Canal";
                        
                        let qualidade = "HD";
                        let nomeLower = nome.toLowerCase();
                        if (nomeLower.includes("4k") || nomeLower.includes("uhd")) {
                            qualidade = "4K";
                        } else if (nomeLower.includes("fhd") || nomeLower.includes("full hd") || nomeLower.includes("1080p")) {
                            qualidade = "FHD";
                        } else if (nomeLower.includes("sd") || nomeLower.includes("standard")) {
                            qualidade = "SD";
                        } else if (nomeLower.includes("hd")) {
                            qualidade = "HD";
                        }

                        return { 
                            titulo: nome, 
                            categoria: categoria.trim(), 
                            capa: capa, 
                            url: item.url || "", 
                            qualidade: qualidade 
                        };
                    });
                } else if (Array.isArray(dadosJson)) {
                    listaCanais = dadosJson.map(item => {
                        let nome = item.titulo || item.name || "Canal";
                        let qual = "HD";
                        let nL = nome.toLowerCase();
                        if (nL.includes("4k")) qual = "4K";
                        else if (nL.includes("fhd") || nL.includes("1080p")) qual = "FHD";
                        else if (nL.includes("sd")) qual = "SD";
                        return { ...item, qualidade: qual };
                    });
                }

                organizarCategorias();
                atualizarContadores();
                renderizarHome();

                setTimeout(() => { document.getElementById('splashScreen').classList.add('hidden'); }, 400);
            } catch (e) {
                console.error(e);
                document.getElementById('splashScreen').classList.add('hidden');
                mostrarAvisoCatalogoVazio();
            }
        }

        function organizarCategorias() {
            categoriasMap = {};
            listaCanais.forEach(canal => {
                const cat = canal.categoria !== "" ? canal.categoria : "Outros Canais";
                if (!categoriasMap[cat]) categoriasMap[cat] = [];
                categoriasMap[cat].push(canal);
            });
        }

        function atualizarContadores() {
            document.getElementById('favCount').textContent = favoritos.length;
        }

        function renderizarHome() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = '';

            if (listaCanais.length === 0) {
                mostrarAvisoCatalogoVazio();
                return;
            }

            // 1. CARROSSEL DE DESTAQUES PRINCIPAIS NO TOPO
            let destaques = [...listaCanais].sort(() => 0.5 - Math.random()).slice(0, 8);
            if (destaques.length > 0) {
                const heroSection = document.createElement('div');
                heroSection.className = 'category-section';
                heroSection.innerHTML = `
                    <div class="category-header">
                        <div class="category-title">Canais em Destaque</div>
                    </div>
                `;
                
                const carousel = document.createElement('div');
                carousel.className = 'matches-carousel';
                
                destaques.forEach(canal => {
                    carousel.appendChild(criarCardCanal(canal));
                });

                heroSection.appendChild(carousel);
                container.appendChild(heroSection);
            }

            // 2. CATEGORIAS DE CANAIS EM CARROSSÉIS FLUIDOS
            for (const [categoria, itens] of Object.entries(categoriasMap)) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'category-section';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'category-header';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.textContent = categoria;

                headerDiv.appendChild(titleDiv);

                if (itens.length > 8) {
                    const btnMore = document.createElement('button');
                    btnMore.className = 'btn-see-more';
                    btnMore.textContent = `Ver Todos (${itens.length})`;
                    btnMore.onclick = () => renderizarListaEspecifica(categoria, itens);
                    headerDiv.appendChild(btnMore);
                }

                const carouselDiv = document.createElement('div');
                carouselDiv.className = 'matches-carousel';

                itens.slice(0, 10).forEach(canal => {
                    carouselDiv.appendChild(criarCardCanal(canal));
                });

                sectionDiv.appendChild(headerDiv);
                sectionDiv.appendChild(carouselDiv);
                container.appendChild(sectionDiv);
            }
        }

        function mostrarAvisoCatalogoVazio() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="empty-catalog-box">
                    <div style="font-size: 16px; font-weight: 800;">Grelha em Atualização</div>
                    <div style="font-size: 13px; color: var(--text-secondary);">Os canais de transmissão estão a ser configurados no futebol.json.</div>
                </div>
            `;
        }

        function criarCardCanal(canal) {
            const card = document.createElement('div');
            card.className = 'match-card';
            const qual = canal.qualidade || "HD";

            card.innerHTML = `
                <div class="poster-wrapper">
                    <div class="live-badge">LIVE</div>
                    <div class="quality-badge">${qual}</div>
                    <img class="match-logo" src="${canal.capa}" alt="${canal.titulo}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500'">
                </div>
                <div class="match-details">
                    <div class="match-name">${canal.titulo}</div>
                    <div class="match-sub">Transmissão Direta</div>
                </div>
            `;
            card.onclick = () => abrirDetalhes(canal);
            return card;
        }

        function filtrarPorAba(nomeAba) {
            abaAtiva = nomeAba;
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.tab-chip').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            const container = document.getElementById('mainContainer');
            container.innerHTML = '';

            if (nomeAba === 'Todos') {
                renderizarHome();
            } else if (nomeAba === 'Favoritos') {
                renderizarListaEspecifica("Canais Favoritos", favoritos);
            } else if (nomeAba === 'Historico') {
                renderizarListaEspecifica("Transmissões Recentes", historicoLista);
            }
        }

        function renderizarListaEspecifica(titulo, itens) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="list-header-bar">
                    <button class="btn-back" onclick="voltarHome()">Voltar</button>
                    <h2 style="font-size: 16px; font-weight: 800;">${titulo} (${itens.length})</h2>
                </div>
                <div class="matches-grid-wrapper">
                    <div class="matches-grid" id="gridContent"></div>
                </div>
            `;
            const grid = document.getElementById('gridContent');
            if (!itens || itens.length === 0) {
                grid.innerHTML = '<div class="status-message">Nenhum canal encontrado nesta lista.</div>';
                return;
            }
            itens.forEach(canal => { grid.appendChild(criarCardCanal(canal)); });
        }

        function toggleFavoritoAtual() {
            if (!canalSelecionado) return;
            const index = favoritos.findIndex(f => f.titulo === canalSelecionado.titulo && f.url === canalSelecionado.url);
            if (index > -1) {
                favoritos.splice(index, 1);
                document.getElementById('btnFav').textContent = "Adicionar aos Favoritos";
            } else {
                favoritos.push(canalSelecionado);
                document.getElementById('btnFav').textContent = "Remover dos Favoritos";
            }
            localStorage.setItem('futebol_favs', JSON.stringify(favoritos));
            atualizarContadores();
        }

        function salvarHistoricoAtivo() {
            if (!canalSelecionado) return;
            historicoLista = historicoLista.filter(f => !(f.titulo === canalSelecionado.titulo && f.url === canalSelecionado.url));
            historicoLista.unshift(canalSelecionado);
            if (historicoLista.length > 20) historicoLista.pop();
            localStorage.setItem('futebol_history_list', JSON.stringify(historicoLista));
        }

        function dispararBuscaComDelay() {
            clearTimeout(tempoBusca);
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!termo) { renderizarHome(); return; }

            tempoBusca = setTimeout(() => {
                let filtrados = listaCanais.filter(c => c.titulo.toLowerCase().includes(termo));
                renderizarListaEspecifica(`Pesquisa: "${termo}"`, filtrados);
            }, 400);
        }

        function voltarHome() {
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.tab-chip')[0].click();
        }

        function abrirDetalhes(canal) {
            canalSelecionado = canal;
            document.getElementById('detTitulo').textContent = canal.titulo;
            document.getElementById('detCategoria').textContent = canal.categoria || 'Futebol Live';
            document.getElementById('detCapa').src = canal.capa || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500';
            
            const qual = canal.qualidade || "HD";
            document.getElementById('detQualidadeBadge').innerHTML = `● SINAL EM DIRETO • <span style="color:#fff;">${qual}</span>`;

            const vlcUrl = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(canal.url)}`;
            document.getElementById('btnAssistir').href = vlcUrl;

            const isFav = favoritos.some(f => f.titulo === canal.titulo && f.url === canal.url);
            document.getElementById('btnFav').textContent = isFav ? "Remover dos Favoritos" : "Adicionar aos Favoritos";

            document.getElementById('detailModal').classList.add('active');
        }

        function fecharDetalhes() { document.getElementById('detailModal').classList.remove('active'); }
        function fecharDetalhesFora(event) { if (event.target.id === 'detailModal') fecharDetalhes(); }

        carregarCanais();
    </script>
</body>
</html>
