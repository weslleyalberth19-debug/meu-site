<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Configurações PWA e Tela Inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Futebol Live">
    <title>Futebol Live - Canais ao Vivo</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #161618;
            --surface-hover: #2c2c2e;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #30d158; /* Verde Relvado / Transmissão Live */
            --radius: 14px;
            --modal-bg: rgba(28, 28, 30, 0.95);
            --header-bg: rgba(0, 0, 0, 0.85);
            --filter-bg: rgba(0, 0, 0, 0.5);
            --banner-bg: rgba(28, 28, 30, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }

        /* Tela de Abertura (Splash Screen) */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-logo {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.8px;
            color: #fff;
            margin-bottom: 12px;
        }
        .splash-logo span { color: var(--accent); }
        .splash-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(48,209,88,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Cabeçalho Apple TV */
        header {
            padding: 16px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); cursor: pointer; }
        .brand span { color: var(--accent); }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        .btn-switch-universe {
            background: var(--surface-color);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            padding: 7px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-switch-universe:hover { background: var(--surface-hover); }

        .search-box {
            background: var(--surface-color);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            padding: 7px 14px;
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 130px;
            transition: width 0.3s ease;
        }
        .search-box:focus { width: 180px; }

        /* Barra de Filtros e Ordenação */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--filter-bg);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            padding: 0 20px;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 14px 0;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-chip {
            background: var(--surface-color);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: -0.2px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-chip.active {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(48,209,88,0.3);
        }
        .btn-sort {
            background: var(--surface-color);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 10px;
        }

        /* Container Principal */
        .container { padding: 40px 20px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container:not(:has(.empty-catalog-box)) { align-items: stretch; justify-content: flex-start; }
        
        /* Caixa de Aviso Elegante para Catálogo Vazio */
        .empty-catalog-box {
            background: var(--surface-color);
            border: 0.5px solid rgba(48, 209, 88, 0.3);
            border-radius: 20px;
            padding: 36px 24px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .empty-catalog-icon {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .empty-catalog-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.4px;
        }
        .empty-catalog-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            letter-spacing: -0.2px;
        }
        .empty-catalog-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(48,209,88,0.3);
            display: inline-block;
        }

        /* Seções de Categoria de Canais */
        .category-section { width: 100%; margin-bottom: 32px; }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .category-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .btn-see-more {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .movies-carousel {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
            align-items: flex-start;
        }
        .movies-carousel::-webkit-scrollbar { display: none; }

        /* Cards de Canais ao Vivo */
        .movie-card {
            background: transparent;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            flex: 0 0 135px;
            width: 135px;
            transition: transform 0.25s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }
        @media (min-width: 768px) {
            .movie-card { flex: 0 0 160px; width: 160px; }
        }
        .movie-card:hover { transform: translateY(-4px); }
        .movie-card:active { transform: scale(0.95); }

        .poster-wrapper {
            width: 100%;
            aspect-ratio: 16 / 10 !important; /* Formato horizontal ideal para logos de canais de TV */
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface-color);
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .movie-poster {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
        }

        .live-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(48, 209, 88, 0.85);
            backdrop-filter: blur(8px);
            color: #000;
            font-size: 8px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 6px;
            z-index: 2;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .movie-details {
            margin-top: 8px;
            padding: 0 2px;
        }
        .movie-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
            text-align: center;
        }

        /* Grelha perfeitamente centrada e simétrica */
        .movies-grid-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 16px;
            width: 100%;
            justify-content: center;
            align-items: start;
        }
        @media (min-width: 768px) {
            .movies-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        }

        /* Barra Superior da Lista */
        .list-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .nav-back-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-back {
            background: var(--surface-color);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-clear-history {
            background: rgba(255, 69, 58, 0.15);
            border: 0.5px solid rgba(255, 69, 58, 0.3);
            color: #ff453a;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Janela de Detalhes (Modal) */
        .detail-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            display: flex;
            align-items: flex-end;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        @media (min-width: 768px) {
            .detail-overlay { align-items: center; justify-content: center; }
        }
        .detail-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .detail-card {
            background: var(--modal-bg);
            border-top: 0.5px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-height: 85vh;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 -15px 50px rgba(0,0,0,0.95);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @media (min-width: 768px) {
            .detail-card {
                width: 440px;
                border-radius: 24px;
                border: 0.5px solid rgba(255, 255, 255, 0.2);
                transform: scale(0.92);
            }
        }
        .detail-overlay.active .detail-card { transform: translateY(0); }
        @media (min-width: 768px) {
            .detail-overlay.active .detail-card { transform: scale(1); }
        }

        .detail-header {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            align-items: center;
        }
        .detail-poster {
            width: 110px;
            aspect-ratio: 16/10;
            border-radius: 12px;
            object-fit: contain;
            background: var(--surface-color);
            padding: 8px;
            border: 0.5px solid rgba(255,255,255,0.2);
        }
        .detail-meta {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }
        .detail-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .detail-category-tag {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        .vlc-notice {
            background: var(--surface-color);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .detail-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .btn-play-vlc {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 15px rgba(48,209,88,0.4);
        }
        .btn-favorite-toggle {
            background: var(--surface-color);
            color: var(--text-primary);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            padding: 11px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .btn-close-detail {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }

        .status-message {
            text-align: center; color: var(--text-secondary); padding: 40px; font-size: 13px; width: 100%;
        }
    </style>
</head>
<body>

    <!-- Tela de Abertura (Splash Screen) -->
    <div id="splashScreen">
        <div class="splash-logo">Futebol<span>Live</span></div>
        <div class="splash-spinner"></div>
    </div>

    <!-- Cabeçalho -->
    <header>
        <div class="brand" onclick="voltarHome()">Futebol<span>Live</span></div>
        <div class="header-actions">
            <a href="index.html" class="btn-switch-universe">FreeTV</a>
            <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar..." oninput="dispararBuscaComDelay()">
        </div>
    </header>

    <!-- Barra de Abas e Ordenação A-Z -->
    <div class="filter-bar">
        <div class="filter-tabs" id="filterTabs">
            <div class="tab-chip active" onclick="filtrarPorAba('Todos')">Todos</div>
            <div class="tab-chip" onclick="filtrarPorAba('Favoritos')">Favoritos (0)</div>
            <div class="tab-chip" onclick="filtrarPorAba('Historico')">Recentes</div>
        </div>
        <button class="btn-sort" id="btnSort" onclick="alternarOrdem()">A-Z</button>
    </div>

    <!-- Container Principal com Sistema de Manutenção Automático -->
    <div class="container" id="mainContainer">
        <div class="status-message">A carregar canais de futebol...</div>
    </div>

    <!-- Janela de Detalhes (Modal) -->
    <div class="detail-overlay" id="detailModal" onclick="fecharDetalhesFora(event)">
        <div class="detail-card" id="detailCard">
            <div class="detail-header">
                <img id="detCapa" class="detail-poster" src="" alt="Logo">
                <div class="detail-meta">
                    <div class="detail-category-tag" id="detCategoria">Futebol Live</div>
                    <div class="detail-title" id="detTitulo">Nome do Canal</div>
                    <div style="font-size: 11px; color: var(--accent); font-weight: 700;">● TRANSMISSÃO AO VIVO</div>
                </div>
            </div>
            <div class="vlc-notice">
                ⚽ Abertura direta do sinal de jogo no leitor VLC do seu dispositivo.
            </div>
            <div class="detail-actions">
                <a id="btnAssistir" href="#" class="btn-play-vlc" onclick="salvarHistoricoAtivo()">Assistir no VLC</a>
                <button id="btnFav" class="btn-favorite-toggle" onclick="toggleFavoritoAtual()">Adicionar aos Favoritos</button>
                <button class="btn-close-detail" onclick="fecharDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let listaCanais = [];
        let categoriasMap = {};
        let favoritos = JSON.parse(localStorage.getItem('futebol_favs')) || [];
        let historicoLista = JSON.parse(localStorage.getItem('futebol_history_list')) || [];
        
        let canalSelecionado = null;
        let tempoBusca = null;
        let abaAtiva = 'Todos';
        let ordemAZ = false;

        async function carregarCanais() {
            try {
                // Podes usar um ficheiro dedicado como 'futebol.json' ou 'aovivo.json'
                const response = await fetch('futebol.json');
                const dadosJson = await response.json();
                
                if (dadosJson.channels && Array.isArray(dadosJson.channels)) {
                    listaCanais = dadosJson.channels.map(item => {
                        let categoria = item.group || (item.attributes && item.attributes['group-title']) || "Canais Esportivos";
                        let capa = (item.attributes && item.attributes['tvg-logo']) || "";
                        let nome = item.name || "Canal ao Vivo";
                        return {
                            titulo: nome,
                            categoria: categoria.trim(),
                            capa: capa,
                            url: item.url || ""
                        };
                    });
                } else if (Array.isArray(dadosJson)) {
                    listaCanais = dadosJson;
                }

                organizarCategorias();
                construirAbas();
                renderizarHome();

                setTimeout(() => {
                    document.getElementById('splashScreen').classList.add('hidden');
                }, 600);

            } catch (e) {
                console.error(e);
                document.getElementById('splashScreen').classList.add('hidden');
                mostrarAvisoCatalogoVazio();
            }
        }

        function organizarCategorias() {
            categoriasMap = {};
            listaCanais.forEach(canal => {
                const cat = canal.categoria !== "" ? canal.categoria : "Esportes";
                if (!categoriasMap[cat]) categoriasMap[cat] = [];
                categoriasMap[cat].push(canal);
            });

            if (ordemAZ) {
                for (const cat in categoriasMap) {
                    categoriasMap[cat].sort((a, b) => a.titulo.localeCompare(b.titulo));
                }
            }
        }

        function alternarOrdem() {
            ordemAZ = !ordemAZ;
            document.getElementById('btnSort').textContent = ordemAZ ? "Padrão" : "A-Z";
            document.getElementById('btnSort').style.background = ordemAZ ? "rgba(48,209,88,0.2)" : "var(--surface-color)";
            organizarCategorias();
            filtrarPorAba(abaAtiva);
        }

        function construirAbas() {
            const tabsContainer = document.getElementById('filterTabs');
            tabsContainer.innerHTML = `
                <div class="tab-chip ${abaAtiva === 'Todos' ? 'active' : ''}" onclick="filtrarPorAba('Todos')">Todos</div>
                <div class="tab-chip ${abaAtiva === 'Favoritos' ? 'active' : ''}" onclick="filtrarPorAba('Favoritos')">Favoritos (${favoritos.length})</div>
                <div class="tab-chip ${abaAtiva === 'Historico' ? 'active' : ''}" onclick="filtrarPorAba('Historico')">Recentes (${historicoLista.length})</div>
            `;
            
            for (const cat of Object.keys(categoriasMap)) {
                let chip = document.createElement('div');
                chip.className = `tab-chip ${abaAtiva === cat ? 'active' : ''}`;
                chip.textContent = cat;
                chip.onclick = () => filtrarPorAba(cat);
                tabsContainer.appendChild(chip);
            }
        }

        function filtrarPorAba(nomeAba) {
            abaAtiva = nomeAba;
            document.getElementById('searchInput').value = '';
            construirAbas();

            if (listaCanais.length === 0) {
                mostrarAvisoCatalogoVazio();
                return;
            }

            if (nomeAba === 'Todos') {
                renderizarHome();
            } else if (nomeAba === 'Favoritos') {
                let listaFavs = [...favoritos];
                if (ordemAZ) listaFavs.sort((a, b) => a.titulo.localeCompare(b.titulo));
                renderizarListaEspecifica("Favoritos", listaFavs, false);
            } else if (nomeAba === 'Historico') {
                let listaHist = [...historicoLista];
                if (ordemAZ) listaHist.sort((a, b) => a.titulo.localeCompare(b.titulo));
                renderizarListaEspecifica("Recentes", listaHist, true);
            } else {
                renderizarListaEspecifica(nomeAba, categoriasMap[nomeAba], false);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderizarHome() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = '';

            if (listaCanais.length === 0) {
                mostrarAvisoCatalogoVazio();
                return;
            }

            // 1. Seção de Favoritos no Topo da Home (se houver)
            if (favoritos.length > 0) {
                const favSection = document.createElement('div');
                favSection.className = 'category-section';
                favSection.innerHTML = `
                    <div class="category-header">
                        <div class="category-title">Canais Favoritos</div>
                        <button class="btn-see-more" onclick="filtrarPorAba('Favoritos')">Ver Todos (${favoritos.length})</button>
                    </div>
                `;
                const favCarousel = document.createElement('div');
                favCarousel.className = 'movies-carousel';
                favoritos.slice(0, 8).forEach(canal => {
                    favCarousel.appendChild(criarCardCanal(canal));
                });
                favSection.appendChild(favCarousel);
                container.appendChild(favSection);
            }

            // 2. Categorias de Canais ao Vivo
            for (const [categoria, itens] of Object.entries(categoriasMap)) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'category-section';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'category-header';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.textContent = categoria;

                headerDiv.appendChild(titleDiv);

                if (itens.length > 8) {
                    const btnMore = document.createElement('button');
                    btnMore.className = 'btn-see-more';
                    btnMore.textContent = `Ver Mais (${itens.length})`;
                    btnMore.onclick = () => filtrarPorAba(categoria);
                    headerDiv.appendChild(btnMore);
                }

                const carouselDiv = document.createElement('div');
                carouselDiv.className = 'movies-carousel';

                itens.slice(0, 8).forEach(canal => {
                    carouselDiv.appendChild(criarCardCanal(canal));
                });

                if (itens.length > 8) {
                    const seeMoreCard = document.createElement('div');
                    seeMoreCard.className = 'see-more-card';
                    seeMoreCard.style.cssText = "background:var(--surface-color); border:0.5px dashed rgba(255,255,255,0.25); border-radius:var(--radius); aspect-ratio:16/10; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; flex:0 0 135px; width:135px;";
                    seeMoreCard.innerHTML = `<div style="font-size:12px; font-weight:600; color:var(--accent); text-align:center; padding:0 10px;">Ver Mais (${itens.length})</div>`;
                    seeMoreCard.onclick = () => filtrarPorAba(categoria);
                    carouselDiv.appendChild(seeMoreCard);
                }

                sectionDiv.appendChild(headerDiv);
                sectionDiv.appendChild(carouselDiv);
                container.appendChild(sectionDiv);
            }
        }

        function mostrarAvisoCatalogoVazio() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="empty-catalog-box">
                    <div class="empty-catalog-icon">⚽</div>
                    <div class="empty-catalog-title">Grelha em Atualização</div>
                    <div class="empty-catalog-text">Os canais de futebol e transmissões ao vivo estão a ser preparados. As partidas e links diretos aparecem aqui em breve!</div>
                    <a href="index.html" class="empty-catalog-btn">Explorar FreeTV</a>
                </div>
            `;
        }

        function renderizarListaEspecifica(titulo, itens, isHistorico) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = '';

            const headerBar = document.createElement('div');
            headerBar.className = 'list-header-bar';

            const navBar = document.createElement('div');
            navBar.className = 'nav-back-bar';
            navBar.innerHTML = `<button class="btn-back" onclick="voltarHome()">Voltar</button><h2 style="font-size:16px; font-weight:600;">${titulo} (${itens.length})</h2>`;
            headerBar.appendChild(navBar);

            if (isHistorico && itens.length > 0) {
                const clearBtn = document.createElement('button');
                clearBtn.className = 'btn-clear-history';
                clearBtn.textContent = 'Limpar Recentes';
                clearBtn.onclick = limparHistoricoCompleto;
                headerBar.appendChild(clearBtn);
            }

            container.appendChild(headerBar);

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'movies-grid-wrapper';

            const gridDiv = document.createElement('div');
            gridDiv.className = 'movies-grid';

            if (!itens || itens.length === 0) {
                gridWrapper.innerHTML = '<div class="status-message">Nenhum canal encontrado nesta lista.</div>';
                container.appendChild(gridWrapper);
                return;
            }

            itens.forEach(canal => {
                gridDiv.appendChild(criarCardCanal(canal));
            });

            gridWrapper.appendChild(gridDiv);
            container.appendChild(gridWrapper);
        }

        function criarCardCanal(canal) {
            const card = document.createElement('div');
            card.className = 'movie-card';

            card.innerHTML = `
                <div class="poster-wrapper">
                    <div class="live-badge">AO VIVO</div>
                    <img class="movie-poster" src="${canal.capa}" alt="${canal.titulo}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500'">
                </div>
                <div class="movie-details">
                    <div class="movie-name">${canal.titulo}</div>
                </div>
            `;

            card.onclick = () => abrirDetalhes(canal);
            return card;
        }

        function limparHistoricoCompleto() {
            historicoLista = [];
            localStorage.removeItem('futebol_history_list');
            filtrarPorAba('Historico');
        }

        function toggleFavoritoAtual() {
            if (!canalSelecionado) return;
            const index = favoritos.findIndex(f => f.titulo === canalSelecionado.titulo && f.url === canalSelecionado.url);
            
            if (index > -1) {
                favoritos.splice(index, 1);
                document.getElementById('btnFav').textContent = "Adicionar aos Favoritos";
            } else {
                favoritos.push(canalSelecionado);
                document.getElementById('btnFav').textContent = "Remover dos Favoritos";
            }

            localStorage.setItem('futebol_favs', JSON.stringify(favoritos));
            construirAbas();
        }

        function salvarHistoricoAtivo() {
            if (!canalSelecionado) return;
            
            historicoLista = historicoLista.filter(f => !(f.titulo === canalSelecionado.titulo && f.url === canalSelecionado.url));
            historicoLista.unshift(canalSelecionado);
            if (historicoLista.length > 20) historicoLista.pop();

            localStorage.setItem('futebol_history_list', JSON.stringify(historicoLista));
            construirAbas();
        }

        function dispararBuscaComDelay() {
            clearTimeout(tempoBusca);
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();

            if (!termo || listaCanais.length === 0) {
                return;
            }

            tempoBusca = setTimeout(() => {
                let filtrados = listaCanais.filter(canal => 
                    canal.titulo.toLowerCase().includes(termo)
                );
                if (ordemAZ) filtrados.sort((a, b) => a.titulo.localeCompare(b.titulo));
                renderizarListaEspecifica(`Pesquisa: "${termo}"`, filtrados, false);
            }, 500);
        }

        function voltarHome() {
            document.getElementById('searchInput').value = '';
            filtrarPorAba('Todos');
        }

        function abrirDetalhes(canal) {
            canalSelecionado = canal;
            document.getElementById('detTitulo').textContent = canal.titulo;
            document.getElementById('detCategoria').textContent = canal.categoria || 'Futebol Live';
            document.getElementById('detCapa').src = canal.capa || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500';

            const vlcUrl = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(canal.url)}`;
            document.getElementById('btnAssistir').href = vlcUrl;

            const isFav = favoritos.some(f => f.titulo === canal.titulo && f.url === canal.url);
            document.getElementById('btnFav').textContent = isFav ? "Remover dos Favoritos" : "Adicionar aos Favoritos";

            document.getElementById('detailModal').classList.add('active');
        }

        function fecharDetalhes() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function fecharDetalhesFora(event) {
            if (event.target.id === 'detailModal') {
                fecharDetalhes();
            }
        }

        carregarCanais();
    </script>
</body>
</html>
