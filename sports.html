<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FreeTV Sports">
    <link rel="manifest" href="manifest.json">
    <title>FreeTV Sports</title>
    <style>
        :root {
            --bg-arena: #080c14;
            --surface-card: #111827;
            --surface-elevated: #1a2333;
            --border-subtle: rgba(255, 255, 255, 0.09);
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.22);
            --accent-text: #04130a;
            --live-red: #ff3b5c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html {
            scroll-behavior: smooth;
            height: 100%;
            overscroll-behavior-y: none;
        }

        body {
            background-color: var(--bg-arena);
            background-image: radial-gradient(circle at 50% -10%, rgba(0, 230, 118, 0.08), transparent 45%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 50px;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Splash Screen Arena */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-arena);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 999;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.6px;
        }
        .splash-tag {
            background: var(--accent);
            color: var(--accent-text);
            font-size: 11px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.8px;
        }
        .splash-bar {
            width: 140px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .splash-bar-fill {
            width: 45%;
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            animation: slideLoad 0.9s ease-in-out infinite alternate;
        }
        @keyframes slideLoad {
            from { transform: translateX(-20%); }
            to { transform: translateX(140%); }
        }

        /* Toast */
        #toastNotification {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface-elevated);
            border: 1px solid rgba(0, 230, 118, 0.35);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 12px 30px rgba(0,0,0,0.75);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }
        #toastNotification.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Cabeçalho Próprio */
        header {
            padding: 14px 18px;
            background: rgba(8, 12, 20, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .brand-name {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .brand-pill {
            background: var(--accent);
            color: var(--accent-text);
            font-size: 10px;
            font-weight: 900;
            padding: 3px 7px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Pesquisa fixa (não cresce ao focar) */
        .search-box {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            width: 130px;
            transition: border-color 0.2s, background 0.2s;
        }
        .search-box:focus {
            background: var(--surface-elevated);
            border-color: var(--accent);
        }

        .btn-switch-ecosystem {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 7px 11px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-switch-ecosystem:hover {
            border-color: rgba(255,255,255,0.25);
            color: #fff;
        }

        .btn-icon {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            width: 35px;
            height: 35px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }
        .btn-icon:active {
            transform: scale(0.93);
        }

        /* Barra de Categorias */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(17, 24, 39, 0.45);
        }
        .filter-bar::-webkit-scrollbar {
            display: none;
        }
        .tab-chip {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-chip.active {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* Container Principal */
        .container {
            padding: 18px 16px 30px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Banner Destaque Arena */
        .arena-hero {
            position: relative;
            background: linear-gradient(135deg, #131c2e 0%, #0d1320 60%, #091a14 100%);
            border: 1px solid rgba(0, 230, 118, 0.22);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            overflow: hidden;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
        }
        .arena-hero::after {
            content: '';
            position: absolute;
            right: -30px;
            top: -30px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(0, 230, 118, 0.16), transparent 70%);
            pointer-events: none;
        }
        .hero-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
            flex: 1;
            min-width: 0;
        }
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 59, 92, 0.15);
            border: 1px solid rgba(255, 59, 92, 0.4);
            color: #ff6b84;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            width: fit-content;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--live-red);
            animation: pulseLive 1.4s infinite;
        }
        @keyframes pulseLive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.8); }
        }
        .hero-title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hero-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .hero-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-watch-vlc {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-watch-vlc:active {
            transform: scale(0.96);
        }
        .hero-logo-box {
            width: 84px;
            height: 84px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            flex-shrink: 0;
            z-index: 2;
        }
        .hero-logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Seções de Canais */
        .section-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--surface-card);
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        /* Grade de Cards Horizontais 16:9 de Canais */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 600px) {
            .channels-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }
        @media (min-width: 900px) {
            .channels-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
        }

        .channel-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease;
            position: relative;
        }
        .channel-card:hover {
            border-color: rgba(0, 230, 118, 0.45);
            background: var(--surface-elevated);
            transform: translateY(-2px);
        }
        .channel-card:active {
            transform: scale(0.97);
        }

        .channel-stage {
            aspect-ratio: 16 / 9;
            width: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            border-bottom: 1px solid var(--border-subtle);
        }
        .channel-logo {
            max-width: 72%;
            max-height: 72%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
            pointer-events: none;
        }
        .channel-fallback-initials {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .badge-live-mini {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(8, 12, 20, 0.82);
            border: 1px solid rgba(255, 59, 92, 0.4);
            color: #ff6b84;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .badge-live-mini span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--live-red);
        }

        .badge-vlc {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 230, 118, 0.14);
            border: 1px solid rgba(0, 230, 118, 0.35);
            color: var(--accent);
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .channel-footer {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .channel-info {
            min-width: 0;
            flex: 1;
        }
        .channel-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-group {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .btn-fav-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-fav-card:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.22);
        }
        .btn-fav-card.is-fav {
            color: var(--accent);
            border-color: rgba(0, 230, 118, 0.4);
            background: rgba(0, 230, 118, 0.1);
        }

        /* Card de Ação do Canal (sem mostrar URL e sem copiar) */
        .vlc-card-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.74);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 400;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        @media (min-width: 640px) {
            .vlc-card-overlay {
                align-items: center;
                padding: 20px;
            }
        }
        .vlc-card-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .vlc-action-card {
            background: var(--surface-card);
            border: 1px solid rgba(0, 230, 118, 0.28);
            width: 100%;
            max-width: 420px;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 -14px 44px rgba(0,0,0,0.85);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (min-width: 640px) {
            .vlc-action-card {
                border-radius: 24px;
                transform: scale(0.95);
            }
        }
        .vlc-card-overlay.active .vlc-action-card {
            transform: translateY(0);
        }
        @media (min-width: 640px) {
            .vlc-card-overlay.active .vlc-action-card {
                transform: scale(1);
            }
        }
        .card-modal-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .card-modal-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--bg-arena);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            flex-shrink: 0;
        }
        .card-modal-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card-modal-meta {
            flex: 1;
            min-width: 0;
        }
        .card-modal-tag {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }
        .card-modal-title {
            font-size: 19px;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-modal-group {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .card-modal-note {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.45;
        }
        .card-modal-actions {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .btn-card-vlc {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-card-fav {
            background: var(--surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .btn-card-close {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 6px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            background: var(--surface-card);
            border-radius: 18px;
            border: 1px solid var(--border-subtle);
        }
    </style>
</head>
<body>

    <!-- Splash Screen Arena -->
    <div id="splashScreen">
        <div class="splash-brand">FreeTV <span class="splash-tag">SPORTS</span></div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    </div>

    <div id="toastNotification">Abrindo no VLC...</div>

    <!-- Cabeçalho Próprio -->
    <header>
        <div class="brand-group" onclick="resetarHome()">
            <span class="brand-name">FreeTV</span>
            <span class="brand-pill">Sports</span>
        </div>

        <div class="header-actions">
            <input type="text" id="searchInput" class="search-box" placeholder="Buscar canal..." oninput="filtrarPorBusca()">
            <a href="../index.html" class="btn-switch-ecosystem" title="Ir para Filmes">🎬 Filmes</a>
            <button class="btn-icon" onclick="copiarLinkSite()" title="Compartilhar Site">↗</button>
        </div>
    </header>

    <!-- Abas de Categorias -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- Conteúdo Principal -->
    <main class="container" id="mainContainer"></main>

    <!-- Card de Ação do Canal -->
    <div class="vlc-card-overlay" id="vlcCardModal" onclick="fecharCardFora(event)">
        <div class="vlc-action-card">
            <div class="card-modal-top">
                <div class="card-modal-logo" id="modalLogoBox"></div>
                <div class="card-modal-meta">
                    <div class="card-modal-tag" id="modalTag">AO VIVO &bull; VLC</div>
                    <div class="card-modal-title" id="modalTitle">Canal</div>
                    <div class="card-modal-group" id="modalGroup">Esportes</div>
                </div>
            </div>
            <div class="card-modal-note" id="modalNote">
                Toque em <strong>Abrir no VLC</strong> para reproduzir a transmissão ao vivo no aplicativo VLC.
            </div>
            <div class="card-modal-actions">
                <a class="btn-card-vlc" id="btnAbrirVlcLink" href="#" onclick="registrarAberturaVlc()">▶ Abrir no VLC</a>
                <button class="btn-card-fav" id="btnModalFav" onclick="toggleFavNoCard()">Adicionar aos Favoritos</button>
                <button class="btn-card-close" onclick="fecharCardCanal()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        let canais = [];
        let categorias = {};
        let favoritos = JSON.parse(localStorage.getItem('freetv_sports_favs')) || [];
        let recentes = JSON.parse(localStorage.getItem('freetv_sports_recent')) || [];
        let abaAtual = 'Todos';
        let canalAtivoCard = null;

        async function carregarCanais() {
            let dados = null;
            for (const arquivo of ['canais.json', 'filmes.json']) {
                try {
                    const res = await fetch(arquivo);
                    if (res.ok) {
                        dados = await res.json();
                        break;
                    }
                } catch (_) {}
            }

            if (!dados) {
                document.getElementById('splashScreen').classList.add('hidden');
                document.getElementById('mainContainer').innerHTML = `
                    <div class="empty-state">
                        Adicione o arquivo <strong>canais.json</strong> na mesma pasta para carregar os canais ao vivo.
                    </div>
                `;
                return;
            }

            const bruto = Array.isArray(dados.channels) ? dados.channels : (Array.isArray(dados) ? dados : []);

            canais = bruto.map((item, index) => {
                const nome = item.name || item.titulo || `Canal ${index + 1}`;
                const grupo = (item.group || (item.attributes && item.attributes['group-title']) || 'Esportes').trim();
                const logo = (item.attributes && item.attributes['tvg-logo']) || item.capa || '';
                const url = item.url || '';
                const lower = nome.toLowerCase();
                let qualidade = 'HD';
                if (lower.includes('4k') || lower.includes('uhd')) qualidade = '4K';
                else if (lower.includes('fhd') || lower.includes('1080')) qualidade = 'FHD';

                return { id: index, nome, grupo, logo, url, qualidade };
            });

            categorias = {};
            canais.forEach(c => {
                if (!categorias[c.grupo]) categorias[c.grupo] = [];
                categorias[c.grupo].push(c);
            });

            renderizarAbas();
            renderizarConteudo();

            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('hidden');
            }, 220);
        }

        function renderizarAbas() {
            const bar = document.getElementById('filterBar');
            const abasFixas = [
                { id: 'Todos', label: `Todos (${canais.length})` },
                { id: 'Favoritos', label: `Favoritos (${favoritos.length})` }
            ];

            bar.innerHTML = '';
            abasFixas.forEach(aba => {
                const el = document.createElement('div');
                el.className = `tab-chip ${abaAtual === aba.id ? 'active' : ''}`;
                el.textContent = aba.label;
                el.onclick = () => {
                    abaAtual = aba.id;
                    document.getElementById('searchInput').value = '';
                    renderizarAbas();
                    renderizarConteudo();
                };
                bar.appendChild(el);
            });

            Object.keys(categorias).forEach(cat => {
                const el = document.createElement('div');
                el.className = `tab-chip ${abaAtual === cat ? 'active' : ''}`;
                el.textContent = cat;
                el.onclick = () => {
                    abaAtual = cat;
                    document.getElementById('searchInput').value = '';
                    renderizarAbas();
                    renderizarConteudo();
                };
                bar.appendChild(el);
            });
        }

        function resetarHome() {
            abaAtual = 'Todos';
            document.getElementById('searchInput').value = '';
            renderizarAbas();
            renderizarConteudo();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderizarConteudo(termoBusca = '') {
            const main = document.getElementById('mainContainer');
            main.innerHTML = '';

            if (canais.length === 0) {
                main.innerHTML = '<div class="empty-state">Nenhum canal disponível no momento.</div>';
                return;
            }

            if (termoBusca) {
                const filtrados = canais.filter(c =>
                    c.nome.toLowerCase().includes(termoBusca) ||
                    c.grupo.toLowerCase().includes(termoBusca)
                );
                main.appendChild(criarSecaoGrade(`Resultados para "${termoBusca}"`, filtrados));
                return;
            }

            if (abaAtual === 'Favoritos') {
                const favCanais = canais.filter(c => favoritos.includes(c.url));
                main.appendChild(criarSecaoGrade('Canais Favoritos', favCanais));
                return;
            }

            if (abaAtual !== 'Todos') {
                main.appendChild(criarSecaoGrade(abaAtual, categorias[abaAtual] || []));
                return;
            }

            const destaque = canais[Math.floor(Math.random() * canais.length)];
            if (destaque) {
                const hero = document.createElement('section');
                hero.className = 'arena-hero';
                hero.innerHTML = `
                    <div class="hero-left">
                        <div class="live-pill"><span class="live-dot"></span> Transmissão Destaque &bull; ${destaque.qualidade}</div>
                        <div class="hero-title">${destaque.nome}</div>
                        <div class="hero-sub">${destaque.grupo} &bull; Reprodução via VLC</div>
                        <div class="hero-actions">
                            <button class="btn-watch-vlc" onclick="abrirCardCanalPorId(${destaque.id})">▶ Abrir no VLC</button>
                        </div>
                    </div>
                    <div class="hero-logo-box">
                        ${destaque.logo
                            ? `<img src="${destaque.logo}" alt="${destaque.nome}" onerror="this.style.display='none'">`
                            : `<span class="channel-fallback-initials">${gerarIniciais(destaque.nome)}</span>`
                        }
                    </div>
                `;
                main.appendChild(hero);
            }

            if (recentes.length > 0) {
                const recCanais = recentes
                    .map(url => canais.find(c => c.url === url))
                    .filter(Boolean)
                    .slice(0, 4);
                if (recCanais.length > 0) {
                    main.appendChild(criarSecaoGrade('Últimos Assistidos', recCanais));
                }
            }

            Object.entries(categorias).forEach(([grupo, lista]) => {
                main.appendChild(criarSecaoGrade(grupo, lista));
            });
        }

        function criarSecaoGrade(titulo, lista) {
            const sec = document.createElement('section');
            sec.className = 'section-block';
            sec.innerHTML = `
                <div class="section-header">
                    <div class="section-title">${titulo} <span class="section-count">${lista.length}</span></div>
                </div>
            `;

            if (!lista || lista.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'Nenhum canal nesta seção.';
                sec.appendChild(empty);
                return sec;
            }

            const grid = document.createElement('div');
            grid.className = 'channels-grid';

            lista.forEach(canal => {
                const isFav = favoritos.includes(canal.url);
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = () => abrirCardCanalPorId(canal.id);

                card.innerHTML = `
                    <div class="channel-stage">
                        <div class="badge-live-mini"><span></span> AO VIVO</div>
                        <div class="badge-vlc">VLC &bull; ${canal.qualidade}</div>
                        ${canal.logo
                            ? `<img class="channel-logo" src="${canal.logo}" alt="${canal.nome}" loading="lazy" onerror="this.outerHTML='<span class=\\'channel-fallback-initials\\'>${gerarIniciais(canal.nome)}</span>'">`
                            : `<span class="channel-fallback-initials">${gerarIniciais(canal.nome)}</span>`
                        }
                    </div>
                    <div class="channel-footer">
                        <div class="channel-info">
                            <div class="channel-name">${canal.nome}</div>
                            <div class="channel-group">${canal.grupo}</div>
                        </div>
                        <button class="btn-fav-card ${isFav ? 'is-fav' : ''}" title="Favoritar" onclick="toggleFavorito(event, '${canal.url.replace(/'/g, "\\'")}', this)">
                            ${isFav ? '♥' : '♡'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            sec.appendChild(grid);
            return sec;
        }

        function gerarIniciais(nome) {
            return nome.split(/\s+/).slice(0, 2).map(p => p[0] || '').join('').toUpperCase() || 'TV';
        }

        function filtrarPorBusca() {
            const termo = document.getElementById('searchInput').value.trim().toLowerCase();
            renderizarConteudo(termo);
        }

        function toggleFavorito(event, url, btn) {
            event.stopPropagation();
            const idx = favoritos.indexOf(url);
            if (idx > -1) {
                favoritos.splice(idx, 1);
                btn.classList.remove('is-fav');
                btn.textContent = '♡';
                mostrarToast('Removido dos favoritos');
            } else {
                favoritos.push(url);
                btn.classList.add('is-fav');
                btn.textContent = '♥';
                mostrarToast('Canal favoritado!');
            }
            localStorage.setItem('freetv_sports_favs', JSON.stringify(favoritos));
            renderizarAbas();
        }

        function montarLinkVlc(url) {
            const isAndroid = /Android/i.test(navigator.userAgent);
            const semProtocolo = url.replace(/^https?:\/\//i, '');
            if (isAndroid) {
                return `intent://${semProtocolo}#Intent;scheme=http;package=org.videolan.vlc;type=video/*;end`;
            }
            return `vlc://${url}`;
        }

        function abrirCardCanalPorId(id) {
            const canal = canais.find(c => c.id === id);
            if (!canal) return;
            canalAtivoCard = canal;

            document.getElementById('modalTag').textContent = `AO VIVO • VLC • ${canal.qualidade}`;
            document.getElementById('modalTitle').textContent = canal.nome;
            document.getElementById('modalGroup').textContent = canal.grupo;

            const logoBox = document.getElementById('modalLogoBox');
            logoBox.innerHTML = canal.logo
                ? `<img src="${canal.logo}" alt="${canal.nome}" onerror="this.outerHTML='<span class=\\'channel-fallback-initials\\'>${gerarIniciais(canal.nome)}</span>'">`
                : `<span class="channel-fallback-initials">${gerarIniciais(canal.nome)}</span>`;

            const isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            document.getElementById('modalNote').innerHTML = isIos
                ? `No <strong>iPhone/iPad</strong>, toque em <strong>Abrir no VLC</strong>. Caso o Safari não abra o aplicativo automaticamente, abra o <strong>VLC</strong> instalado no aparelho.`
                : `Toque em <strong>Abrir no VLC</strong> para reproduzir a transmissão ao vivo no aplicativo VLC.`;

            const linkBtn = document.getElementById('btnAbrirVlcLink');
            linkBtn.href = canal.url ? montarLinkVlc(canal.url) : '#';

            atualizarBotaoFavCard();
            document.getElementById('vlcCardModal').classList.add('active');
        }

        function registrarAberturaVlc() {
            if (!canalAtivoCard || !canalAtivoCard.url) return;
            recentes = [canalAtivoCard.url, ...recentes.filter(u => u !== canalAtivoCard.url)].slice(0, 12);
            localStorage.setItem('freetv_sports_recent', JSON.stringify(recentes));
            mostrarToast(`Abrindo ${canalAtivoCard.nome} no VLC...`);
        }

        function toggleFavNoCard() {
            if (!canalAtivoCard) return;
            const idx = favoritos.indexOf(canalAtivoCard.url);
            if (idx > -1) favoritos.splice(idx, 1);
            else favoritos.push(canalAtivoCard.url);

            localStorage.setItem('freetv_sports_favs', JSON.stringify(favoritos));
            atualizarBotaoFavCard();
            renderizarAbas();
            renderizarConteudo(document.getElementById('searchInput').value.trim().toLowerCase());
        }

        function atualizarBotaoFavCard() {
            if (!canalAtivoCard) return;
            const isFav = favoritos.includes(canalAtivoCard.url);
            document.getElementById('btnModalFav').textContent = isFav ? 'Remover dos Favoritos' : 'Adicionar aos Favoritos';
        }

        function fecharCardCanal() {
            document.getElementById('vlcCardModal').classList.remove('active');
            renderizarConteudo(document.getElementById('searchInput').value.trim().toLowerCase());
        }

        function fecharCardFora(event) {
            if (event.target.id === 'vlcCardModal') fecharCardCanal();
        }

        function copiarLinkSite() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => mostrarToast('Link do site copiado!'))
                    .catch(() => {});
            }
        }

        function mostrarToast(msg) {
            const t = document.getElementById('toastNotification');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        carregarCanais();
    </script>
</body>
</html>
