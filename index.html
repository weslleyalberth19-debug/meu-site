<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player IPTV - Esportes</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .app-container {
            display: flex;
            flex: 1;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 350px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
        }
        .sidebar-title {
            font-weight: bold;
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .filter-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        select, input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #38bdf8;
        }
        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 6px;
            background: #1f2937;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .channel-item:hover, .channel-item.active {
            background: #374151;
            border-left: 4px solid #38bdf8;
        }
        .channel-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            background: #0f172a;
            border-radius: 6px;
            padding: 2px;
            flex-shrink: 0;
        }
        .channel-info {
            overflow: hidden;
            flex: 1;
        }
        .channel-name {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-group {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #030712;
            padding: 20px;
        }
        video {
            width: 100%;
            max-height: 75vh;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .now-playing {
            margin-top: 15px;
            font-size: 16px;
            color: #38bdf8;
            font-weight: 500;
            text-align: center;
        }
        .status-msg {
            color: #94a3b8;
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 55vh;
                border-right: none;
                border-top: 1px solid #1f2937;
            }
            .player-area {
                height: 45vh;
                padding: 10px;
            }
            video {
                max-height: 32vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">⚽ Canais de Esportes (<span id="count">0</span>)</div>
                <div class="filter-box">
                    <select id="categorySelect" onchange="filtrarCanais()">
                        <option value="TODOS">Todas as Categorias</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Buscar canal (ex: SporTV, ESPN)..." oninput="filtrarCanais()">
                </div>
            </div>
            <div class="channels-list" id="channelsList">
                <div class="status-msg">Carregando lista...</div>
            </div>
        </div>

        <div class="player-area">
            <video id="videoPlayer" controls playsinline autoplay></video>
            <div class="now-playing" id="nowPlaying">Selecione um canal para assistir</div>
        </div>
    </div>

    <script>
        let todosCanais = [];
        let hlsInstance = null;

        async function carregarCanais() {
            try {
                const response = await fetch('canais.json');
                todosCanais = await response.json();
                
                preencherCategorias();
                renderizarLista(todosCanais);

                if (todosCanais.length > 0) {
                    tocarCanal(todosCanais[0].url, todosCanais[0].name);
                    const primeiroItem = document.querySelector('.channel-item');
                    if (primeiroItem) primeiroItem.classList.add('active');
                }
            } catch (e) {
                console.error(e);
                document.getElementById('channelsList').innerHTML = 
                    '<div class="status-msg" style="color:#f87171;">Erro ao carregar canais.json. Verifique se o arquivo está na mesma pasta.</div>';
            }
        }

        function preencherCategorias() {
            const select = document.getElementById('categorySelect');
            const grupos = [...new Set(todosCanais.map(c => c.group))];
            
            grupos.forEach(grupo => {
                const opt = document.createElement('option');
                opt.value = grupo;
                opt.textContent = grupo;
                select.appendChild(opt);
            });
        }

        function filtrarCanais() {
            const categoria = document.getElementById('categorySelect').value;
            const termo = document.getElementById('searchInput').value.toLowerCase();

            const filtrados = todosCanais.filter(canal => {
                const bateCategoria = (categoria === 'TODOS') || (canal.group === categoria);
                const bateTexto = canal.name.toLowerCase().includes(termo);
                return bateCategoria && bateTexto;
            });

            renderizarLista(filtrados);
        }

        function renderizarLista(lista) {
            const container = document.getElementById('channelsList');
            document.getElementById('count').innerText = lista.length;
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<div class="status-msg">Nenhum canal encontrado.</div>';
                return;
            }

            lista.forEach(canal => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                
                const logoHtml = canal.logo 
                    ? `<img class="channel-logo" src="${canal.logo}" onerror="this.style.display='none'">` 
                    : '';

                div.innerHTML = `
                    ${logoHtml}
                    <div class="channel-info">
                        <div class="channel-name">${canal.name}</div>
                        <div class="channel-group">${canal.group}</div>
                    </div>
                `;

                div.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    tocarCanal(canal.url, canal.name);
                };

                container.appendChild(div);
            });
        }

        // Toca a URL diretamente do JSON (já tratada e pronta em .m3u8)
        function tocarCanal(urlStream, nome) {
            const video = document.getElementById('videoPlayer');
            document.getElementById('nowPlaying').innerText = `Reproduzindo: ${nome}`;

            if (hlsInstance) {
                hlsInstance.destroy();
            }

            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Suporte nativo HLS no Safari/iPhone
                video.src = urlStream;
                video.play().catch(() => {});
            } else if (Hls.isSupported()) {
                // Suporte via Hls.js para outros navegadores
                hlsInstance = new Hls();
                hlsInstance.loadSource(urlStream);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else {
                video.src = urlStream;
                video.play().catch(() => {});
            }
        }

        carregarCanais();
    </script>
</body>
</html>
