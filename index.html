<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Configurações PWA e Tela Inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FreeTV">
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=500&auto=format&fit=crop&q=60">
    <link rel="manifest" href="manifest.json">
    <title>FreeTV</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1c1c1e;
            --surface-hover: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #86868b;
            --radius: 14px;
            --modal-bg: rgba(28, 28, 30, 0.95);
            --header-bg: rgba(0, 0, 0, 0.9);
            --filter-bg: rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        
        html { 
            scroll-behavior: smooth; 
            height: 100%; 
            overscroll-behavior-y: none;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding-bottom: 50px; 
            overflow-x: hidden; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Tela de Abertura Inteligente */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splashScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-logo { font-size: 34px; font-weight: 800; letter-spacing: -0.8px; color: #fff; margin-bottom: 12px; }
        .splash-spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Notificação Toast */
        #toastNotification {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(28, 28, 30, 0.95); border: 0.5px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
            z-index: 1000; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #toastNotification.show { transform: translateX(-50%) translateY(0); }

        /* Cabeçalho Apple TV */
        header {
            padding: 16px 24px; background: var(--header-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
        }
        
        .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.8px; color: #ffffff; cursor: pointer; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; position: relative; }
        .search-wrapper { position: relative; }
        
        /* Barra de pesquisa FIXA (Sem efeito de expansão ao focar) */
        .search-box {
            background: var(--surface-color); border: 0.5px solid rgba(255, 255, 255, 0.12); padding: 8px 14px;
            border-radius: 16px; color: var(--text-primary); font-size: 13px; outline: none; width: 145px; transition: background 0.2s;
        }
        .search-box:focus { background: var(--surface-hover); border-color: rgba(255,255,255,0.3); }

        /* Dropdown de Histórico fixo abaixo */
        .search-history-dropdown {
            position: absolute; top: calc(100% + 8px); right: 0; width: 240px;
            background: rgba(28, 28, 30, 0.98); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid rgba(255, 255, 255, 0.18); border-radius: 16px;
            padding: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.85);
            z-index: 150; display: none; flex-direction: column; gap: 8px;
        }
        .search-history-dropdown.active { display: flex; }
        .search-history-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .search-history-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-clear-search { background: transparent; border: none; color: #ff453a; font-size: 11px; font-weight: 600; cursor: pointer; }
        .search-history-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 160px; overflow-y: auto; }
        
        .search-tag {
            background: rgba(255, 255, 255, 0.08); border: 0.5px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary); font-size: 12px; padding: 5px 10px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; transition: background 0.2s;
        }
        .search-tag:hover { background: rgba(255, 255, 255, 0.18); }

        .btn-icon-header {
            background: var(--surface-color); border: 0.5px solid rgba(255, 255, 255, 0.12); color: var(--text-primary);
            width: 36px; height: 36px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s, transform 0.15s; font-size: 14px;
        }
        .btn-icon-header:hover { background: var(--surface-hover); }
        .btn-icon-header:active { transform: scale(0.92); }

        /* Barra de Filtros e Ordenação */
        .filter-bar {
            display: flex; justify-content: space-between; align-items: center; background: var(--filter-bg);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.06); padding: 0 20px;
        }
        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-chip {
            background: var(--surface-color); border: 0.5px solid rgba(255, 255, 255, 0.1); color: var(--text-secondary);
            padding: 6px 14px; border-radius: 14px; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all 0.2s;
        }
        .tab-chip.active { background: #fff; color: #000; font-weight: 600; border-color: #fff; }
        .btn-sort {
            background: var(--surface-color); border: 0.5px solid rgba(255, 255, 255, 0.1); color: var(--text-secondary);
            padding: 6px 12px; border-radius: 14px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; margin-left: 10px;
        }

        /* Views Persistentes (SPA) */
        .view-section { display: none; width: 100%; flex-direction: column; }
        .view-section.active { display: flex; }

        /* Billboard Cinematográfico */
        .hero-billboard {
            position: relative; width: 100%; height: 390px; overflow: hidden; margin-bottom: 24px;
            background: #0a0a0c; border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        @media (min-width: 768px) { .hero-billboard { height: 480px; border-radius: 24px; margin: 16px auto 28px auto; width: calc(100% - 32px); border: 0.5px solid rgba(255, 255, 255, 0.14); } }
        
        .billboard-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden; transition: opacity 0.8s ease, transform 6s ease;
            transform: scale(1.04);
        }
        .billboard-slide.active { opacity: 1; visibility: visible; transform: scale(1); z-index: 2; }
        
        .billboard-bg { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; filter: brightness(0.8); }
        .billboard-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, #000000 4%, rgba(0,0,0,0.75) 35%, rgba(0,0,0,0.15) 75%, rgba(0,0,0,0.4) 100%);
        }
        .billboard-info {
            position: absolute; bottom: 34px; left: 20px; right: 20px; z-index: 3;
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
        }
        @media (min-width: 768px) { .billboard-info { align-items: flex-start; text-align: left; left: 40px; max-width: 520px; } }
        
        .billboard-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(255, 255, 255, 0.25); padding: 4px 10px; border-radius: 8px;
            font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #fff;
        }
        .billboard-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,0.9); line-height: 1.15; }
        @media (min-width: 768px) { .billboard-title { font-size: 34px; } }
        
        .billboard-meta { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 500; }
        .billboard-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        
        .btn-billboard-play {
            background: #fff; color: #000; border: none; padding: 11px 24px; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); transition: transform 0.15s;
        }
        .btn-billboard-play:active { transform: scale(0.95); }
        
        .btn-billboard-fav {
            background: rgba(255, 255, 255, 0.16); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 0.5px solid rgba(255, 255, 255, 0.25); color: #fff; width: 42px; height: 42px; border-radius: 12px;
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s;
        }
        .btn-billboard-fav:hover { background: rgba(255, 255, 255, 0.28); }

        .billboard-dots {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 4;
            display: flex; gap: 6px;
        }
        .b-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s; }
        .b-dot.active { width: 18px; border-radius: 4px; background: #fff; }

        /* Container Principal */
        .container { padding: 0 16px 30px 16px; flex: 1; display: flex; flex-direction: column; align-items: stretch; }
        #viewList { padding-top: 24px; }
        
        .empty-catalog-box {
            background: var(--surface-color); border: 0.5px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
            padding: 36px 24px; max-width: 420px; margin: 40px auto; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px; align-items: center;
        }
        .empty-catalog-icon { font-size: 32px; color: #fff; margin-bottom: 4px; }
        .empty-catalog-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .empty-catalog-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        /* Seções de Categoria */
        .category-section { width: 100%; margin-bottom: 28px; }
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .category-title { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
        .btn-see-more { background: transparent; border: none; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer; opacity: 0.8; transition: opacity 0.2s; }
        .btn-see-more:hover { opacity: 1; }

        /* Carrosséis fluidos */
        .movies-carousel {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 10px;
            scrollbar-width: none;
            align-items: flex-start;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
        }
        .movies-carousel::-webkit-scrollbar { display: none; }

        /* Cartão de Filme */
        .movie-card-clean {
            background: transparent;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            flex: 0 0 120px;
            width: 120px;
            min-width: 120px;
            transition: transform 0.2s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }
        @media (min-width: 768px) { 
            .movie-card-clean { 
                flex: 0 0 150px; 
                width: 150px; 
                min-width: 150px; 
            } 
        }
        .movie-card-clean:active { transform: scale(0.95); }

        .poster-clean-wrapper {
            width: 100%; aspect-ratio: 2 / 3 !important; border-radius: var(--radius); overflow: hidden;
            background: var(--surface-color); position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 0.5px solid rgba(255, 255, 255, 0.15);
        }
        .movie-clean-poster { width: 100% !important; height: 100% !important; object-fit: cover !important; position: absolute !important; top: 0; left: 0; pointer-events: none; }
        
        .quality-badge-clean {
            position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px); color: #ffffff; font-size: 8px; font-weight: 700; padding: 3px 6px; border-radius: 6px; z-index: 2;
        }
        .watched-dot {
            position: absolute; bottom: 8px; right: 8px; width: 10px; height: 10px; background: rgba(255, 255, 255, 0.95);
            border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.8); z-index: 3; display: flex; align-items: center; justify-content: center;
        }
        .watched-dot::after { content: ''; width: 4px; height: 4px; background: #000; border-radius: 50%; }

        .card-progress-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.3); z-index: 3;
        }
        .card-progress-fill { height: 100%; background: #ffffff; width: 0%; }

        /* Cartão "Ver Mais" */
        .see-more-card {
            background: var(--surface-color); border: 0.5px dashed rgba(255, 255, 255, 0.25); border-radius: var(--radius);
            aspect-ratio: 2 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            cursor: pointer; flex: 0 0 120px; width: 120px; min-width: 120px; transition: background 0.2s, transform 0.2s;
        }
        @media (min-width: 768px) { .see-more-card { flex: 0 0 150px; width: 150px; min-width: 150px; } }
        .see-more-card:hover { background: var(--surface-hover); transform: translateY(-4px); }
        .see-more-text { font-size: 13px; font-weight: 600; color: #ffffff; text-align: center; padding: 0 8px; }

        /* Grelha "Ver Mais" Completa */
        .movies-grid-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
        .movies-grid-clean { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; justify-content: center; align-items: start; }
        @media (min-width: 480px) { .movies-grid-clean { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; } }
        @media (min-width: 768px) { .movies-grid-clean { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; } }
        .movies-grid-clean .movie-card-clean { width: 100% !important; flex: none !important; min-width: 0 !important; }

        .list-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; width: 100%; }
        .nav-back-bar { display: flex; align-items: center; gap: 12px; }
        .btn-back { background: var(--surface-color); border: 0.5px solid rgba(255, 255, 255, 0.15); color: var(--text-primary); padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-clear-history { background: rgba(255, 69, 58, 0.15); border: 0.5px solid rgba(255, 69, 58, 0.3); color: #ff453a; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

        /* Modal de Detalhes Estilo Apple TV */
        .detail-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            display: flex; align-items: flex-end; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
        }
        @media (min-width: 768px) { .detail-overlay { align-items: center; justify-content: center; } }
        .detail-overlay.active { opacity: 1; pointer-events: auto; }
        .detail-card {
            background: var(--modal-bg); border-top: 0.5px solid rgba(255, 255, 255, 0.2); width: 100%; max-height: 85vh;
            border-radius: 28px 28px 0 0; padding: 28px 24px; overflow-y: auto; box-shadow: 0 -20px 60px rgba(0,0,0,0.9);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (min-width: 768px) { .detail-card { width: 440px; border-radius: 28px; border: 0.5px solid rgba(255, 255, 255, 0.2); transform: scale(0.94); } }
        .detail-overlay.active .detail-card { transform: translateY(0); }
        @media (min-width: 768px) { .detail-overlay.active .detail-card { transform: scale(1); } }

        .detail-header { display: flex; gap: 18px; margin-bottom: 20px; }
        .detail-poster { width: 110px; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; border: 0.5px solid rgba(255,255,255,0.25); box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .detail-meta { display: flex; flex-direction: column; justify-content: center; flex: 1; gap: 4px; }
        .detail-title { font-size: 21px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px; }
        .detail-category-tag { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .detail-quality-badge { display: inline-block; background: rgba(255, 255, 255, 0.15); border: 0.5px solid rgba(255, 255, 255, 0.25); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; width: fit-content; margin-top: 4px; }
        
        .player-notice {
            background: rgba(255, 255, 255, 0.05); border: 0.5px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px; border-radius: 14px; font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.45;
        }

        .detail-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-play-native {
            background: #fff; color: #000; border: none; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
        }
        .btn-favorite-toggle {
            background: var(--surface-color); color: var(--text-primary); border: 0.5px solid rgba(255, 255, 255, 0.15);
            padding: 14px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
        }
        .btn-close-detail { background: transparent; color: var(--text-secondary); border: none; padding: 8px; font-size: 13px; cursor: pointer; text-align: center; }

        /* Player HTML5 Estilizado */
        .video-player-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; user-select: none;
        }
        .video-player-overlay.active { opacity: 1; pointer-events: auto; }
        .tv-player-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        .player-ambient-bg { position: absolute; top: -15%; left: -15%; width: 130%; height: 130%; object-fit: cover; filter: blur(55px) brightness(0.2); z-index: 1; pointer-events: none; }
        
        .native-html5-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; outline: none; background: transparent; z-index: 2;
            -webkit-appearance: none;
        }

        .custom-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%); transition: opacity 0.3s ease;
            pointer-events: auto;
        }
        .custom-hud.hidden-hud { opacity: 0; pointer-events: none; }
        .hud-top { padding: 24px 24px; display: flex; align-items: center; gap: 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); }
        .btn-hud-back {
            background: rgba(255, 255, 255, 0.15); border: 0.5px solid rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px);
            color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
        }
        .hud-title-box { display: flex; flex-direction: column; overflow: hidden; gap: 2px; }
        .hud-badge { font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; }
        .hud-title { font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .hud-center { display: flex; align-items: center; justify-content: center; gap: 42px; }
        .btn-hud-skip {
            background: rgba(255, 255, 255, 0.12); border: 0.5px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(16px);
            color: #fff; width: 52px; height: 52px; border-radius: 50%; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-hud-play {
            background: rgba(255, 255, 255, 0.95); border: none; color: #000; width: 72px; height: 72px; border-radius: 50%; font-size: 24px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .hud-bottom { padding: 24px 24px 32px 24px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); }
        .hud-progress-row { display: flex; align-items: center; gap: 14px; width: 100%; }
        .hud-time { font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.85); font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
        .hud-slider {
            -webkit-appearance: none; appearance: none; flex: 1; height: 6px; background: rgba(255, 255, 255, 0.25); border-radius: 6px; outline: none; cursor: pointer;
        }
        .status-message { text-align: center; color: var(--text-secondary); padding: 40px; font-size: 13px; width: 100%; }
    </style>
</head>
<body>

    <!-- Tela de Abertura Inteligente -->
    <div id="splashScreen">
        <div class="splash-logo">FreeTV</div>
        <div class="splash-spinner"></div>
    </div>

    <!-- Notificação Toast -->
    <div id="toastNotification">Link copiado para a área de transferência!</div>

    <!-- Cabeçalho Apple TV -->
    <header>
        <div class="brand" onclick="irParaTopoHome()">FreeTV</div>
        <div class="header-actions">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar..." 
                       onfocus="mostrarHistoricoPesquisa()" 
                       oninput="dispararBuscaComDelay()"
                       onkeydown="if(event.key==='Enter') { salvarTermoPesquisa(this.value); fecharHistoricoPesquisa(); }">
                
                <div class="search-history-dropdown" id="searchHistoryDropdown">
                    <div class="search-history-header">
                        <span class="search-history-title">Buscas Recentes</span>
                        <button class="btn-clear-search" onclick="limparHistoricoPesquisa()">Limpar</button>
                    </div>
                    <div class="search-history-list" id="searchHistoryList"></div>
                </div>
            </div>

            <!-- Botão Surpreenda-me -->
            <button class="btn-icon-header" onclick="abrirFilmeAleatorio()" title="Surpreenda-me (Filme Aleatório)">
                🎲
            </button>

            <button class="btn-icon-header" onclick="copiarLinkSite()" title="Partilhar Site">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            </button>
        </div>
    </header>

    <!-- Barra de Filtros e Ordenação -->
    <div class="filter-bar">
        <div class="filter-tabs" id="filterTabs">
            <div class="tab-chip active" onclick="selecionarAba('Todos')">Todos</div>
            <div class="tab-chip" onclick="selecionarAba('Favoritos')">Favoritos (0)</div>
            <div class="tab-chip" onclick="selecionarAba('Recentes')">Recentes (0)</div>
        </div>
        <button class="btn-sort" id="btnSort" onclick="alternarOrdem()">A-Z</button>
    </div>

    <!-- Views Persistentes -->
    <div id="viewHome" class="view-section active"></div>
    <div class="container">
        <div id="viewList" class="view-section"></div>
    </div>

    <!-- Janela de Detalhes -->
    <div class="detail-overlay" id="detailModal" onclick="fecharDetalhesFora(event)">
        <div class="detail-card" id="detailCard">
            <div class="detail-header">
                <img id="detCapa" class="detail-poster" src="" alt="Capa">
                <div class="detail-meta">
                    <div class="detail-category-tag" id="detCategoria">Categoria</div>
                    <div class="detail-title" id="detTitulo">Título do Filme</div>
                    <div class="detail-quality-badge" id="detQualidade">HD</div>
                </div>
            </div>
            <div class="player-notice" id="detPlayerNotice">
                🎬 Toque abaixo para reproduzir o filme com o leitor cinematográfico integrado.
            </div>
            <div class="detail-actions">
                <button class="btn-play-native" id="btnPlayAction" onclick="iniciarReproducaoNativa()">▶ Reproduzir Agora</button>
                <button id="btnFav" class="btn-favorite-toggle" onclick="toggleFavoritoAtual()">Adicionar aos Favoritos</button>
                <button class="btn-close-detail" onclick="fecharDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Player de Vídeo -->
    <div class="video-player-overlay" id="videoPlayerOverlay">
        <div class="tv-player-wrapper" id="tvPlayerWrapper" onclick="alternarVisibilidadeHud(event)">
            <img id="playerAmbientBg" class="player-ambient-bg" src="" alt="">
            
            <video id="nativeHtml5Video" class="native-html5-video" playsinline webkit-playsinline x5-playsinline disablepictureinpicture controlslist="nodownload noplaybackrate"></video>

            <div class="custom-hud" id="customHud">
                <div class="hud-top">
                    <button class="btn-hud-back" onclick="fecharPlayerNativo()">✕</button>
                    <div class="hud-title-box">
                        <span class="hud-badge" id="hudQualityBadge">HD &bull; FREETV</span>
                        <div class="hud-title" id="videoPlayerTitle">A carregar...</div>
                    </div>
                </div>

                <div class="hud-center">
                    <button class="btn-hud-skip" onclick="pularTempo(-10)">-10s</button>
                    <button class="btn-hud-play" id="btnHudPlay" onclick="alternarPlayPause()">❚❚</button>
                    <button class="btn-hud-skip" onclick="pularTempo(10)">+10s</button>
                </div>

                <div class="hud-bottom">
                    <div class="hud-progress-row">
                        <span class="hud-time" id="hudCurrentTime">00:00</span>
                        <input type="range" id="hudSlider" class="hud-slider" min="0" max="100" value="0" step="0.1" oninput="arrastarProgresso()">
                        <span class="hud-time" id="hudDuration">00:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let listaFilmes = [];
        let categoriasMap = {};
        let favoritos = JSON.parse(localStorage.getItem('freetv_favs')) || [];
        let historicoProgresso = JSON.parse(localStorage.getItem('freetv_progress')) || {};
        let assistidosLista = JSON.parse(localStorage.getItem('freetv_watched_list')) || [];
        let historicoPesquisas = JSON.parse(localStorage.getItem('freetv_search_history')) || [];
        
        const globalImageCache = new Map();

        let filmeSelecionado = null;
        let tempoBusca = null;
        let abaAtiva = 'Todos';
        let ordemAZ = false;
        let hudTimer = null;
        let salvarProgressoInterval = null;
        let scrollPosAnterior = 0;
        let homeJaRenderizada = false;

        let billboardSlides = [];
        let billboardIndex = 0;
        let billboardTimer = null;

        const videoElem = document.getElementById('nativeHtml5Video');
        const customHud = document.getElementById('customHud');
        const hudSlider = document.getElementById('hudSlider');

        async function carregarFilmes() {
            try {
                const response = await fetch('filmes.json');
                const dadosJson = await response.json();
                
                let bruto = [];
                if (dadosJson.channels && Array.isArray(dadosJson.channels)) {
                    bruto = dadosJson.channels;
                } else if (Array.isArray(dadosJson)) {
                    bruto = dadosJson;
                }

                listaFilmes = bruto.map(item => {
                    let categoria = item.group || (item.attributes && item.attributes['group-title']) || "Outros";
                    let capa = (item.attributes && item.attributes['tvg-logo']) || "";
                    let nome = item.name || "Sem Título";
                    
                    let qualidade = "HD";
                    let nomeLower = nome.toLowerCase();
                    if (nomeLower.includes("hdr") || nomeLower.includes("4k") || nomeLower.includes("ultra")) {
                        qualidade = "HDR";
                    } else if (nomeLower.includes("fhd") || nomeLower.includes("1080p")) {
                        qualidade = "FHD";
                    } else if (Math.random() > 0.6) {
                        qualidade = "HDR";
                    }

                    return {
                        titulo: nome,
                        categoria: categoria.trim(),
                        capa: capa,
                        url: item.url || "",
                        qualidade: qualidade
                    };
                });

                organizarCategorias();
                construirAbas();
                renderizarHome();

                setTimeout(() => {
                    document.getElementById('splashScreen').classList.add('hidden');
                }, 200);

            } catch (e) {
                console.error(e);
                document.getElementById('splashScreen').classList.add('hidden');
                mostrarAvisoCatalogoVazio();
            }
        }

        function organizarCategorias() {
            categoriasMap = {};
            listaFilmes.forEach(filme => {
                const cat = filme.categoria !== "" ? filme.categoria : "Outros";
                if (!categoriasMap[cat]) categoriasMap[cat] = [];
                categoriasMap[cat].push(filme);
            });

            if (ordemAZ) {
                for (const cat in categoriasMap) {
                    categoriasMap[cat].sort((a, b) => a.titulo.localeCompare(b.titulo));
                }
            } else {
                for (const cat in categoriasMap) {
                    categoriasMap[cat].sort(() => Math.random() - 0.5);
                }
            }
        }

        function alternarOrdem() {
            ordemAZ = !ordemAZ;
            document.getElementById('btnSort').textContent = ordemAZ ? "Padrão" : "A-Z";
            document.getElementById('btnSort').style.background = ordemAZ ? "rgba(255,255,255,0.2)" : "var(--surface-color)";
            organizarCategorias();
            homeJaRenderizada = false;
            atualizarTelaAtual();
        }

        function construirAbas() {
            const tabsContainer = document.getElementById('filterTabs');
            tabsContainer.innerHTML = `
                <div class="tab-chip ${abaAtiva === 'Todos' ? 'active' : ''}" onclick="selecionarAba('Todos')">Todos</div>
                <div class="tab-chip ${abaAtiva === 'Favoritos' ? 'active' : ''}" onclick="selecionarAba('Favoritos')">Favoritos (${favoritos.length})</div>
                <div class="tab-chip ${abaAtiva === 'Recentes' ? 'active' : ''}" onclick="selecionarAba('Recentes')">Recentes (${assistidosLista.length})</div>
            `;
            
            for (const cat of Object.keys(categoriasMap)) {
                let chip = document.createElement('div');
                chip.className = `tab-chip ${abaAtiva === cat ? 'active' : ''}`;
                chip.textContent = cat;
                chip.onclick = () => selecionarAba(cat);
                tabsContainer.appendChild(chip);
            }
        }

        function selecionarAba(nomeAba) {
            if (abaAtiva === 'Todos' && nomeAba !== 'Todos') {
                scrollPosAnterior = window.scrollY;
            }
            
            abaAtiva = nomeAba;
            document.getElementById('searchInput').value = '';
            fecharHistoricoPesquisa();
            construirAbas();
            atualizarTelaAtual();

            if (nomeAba === 'Todos') {
                requestAnimationFrame(() => {
                    window.scrollTo({ top: scrollPosAnterior, behavior: 'instant' });
                });
            } else {
                window.scrollTo({ top: 0, behavior: 'instant' });
            }
        }

        function irParaTopoHome() {
            scrollPosAnterior = 0;
            selecionarAba('Todos');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function atualizarTelaAtual() {
            if (listaFilmes.length === 0) {
                mostrarAvisoCatalogoVazio();
                return;
            }

            if (abaAtiva === 'Todos') {
                mostrarView('viewHome');
                if (!homeJaRenderizada) {
                    renderizarHome();
                } else {
                    atualizarSecoesDinamicasHome();
                }
            } else if (abaAtiva === 'Favoritos') {
                mostrarView('viewList');
                let listaFavs = [...favoritos];
                if (ordemAZ) listaFavs.sort((a, b) => a.titulo.localeCompare(b.titulo));
                renderizarListaEspecifica("Favoritos", listaFavs, 'favoritos');
            } else if (abaAtiva === 'Recentes') {
                mostrarView('viewList');
                let listaAst = [...assistidosLista];
                if (ordemAZ) listaAst.sort((a, b) => a.titulo.localeCompare(b.titulo));
                renderizarListaEspecifica("Recentes", listaAst, 'recentes');
            } else {
                mostrarView('viewList');
                renderizarListaEspecifica(abaAtiva, categoriasMap[abaAtiva], null);
            }
        }

        function mostrarView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function renderizarHome() {
            const homeView = document.getElementById('viewHome');
            homeView.innerHTML = '';

            const billboard = document.createElement('div');
            billboard.className = 'hero-billboard';
            billboard.id = 'heroBillboard';

            billboardSlides = [...listaFilmes].sort(() => 0.5 - Math.random()).slice(0, 5);
            billboardSlides.forEach((filme, idx) => {
                const isFav = favoritos.some(f => f.titulo === filme.titulo && f.url === filme.url);
                const slide = document.createElement('div');
                slide.className = `billboard-slide ${idx === 0 ? 'active' : ''}`;
                slide.innerHTML = `
                    <img class="billboard-bg" src="${filme.capa}" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800'">
                    <div class="billboard-vignette"></div>
                    <div class="billboard-info">
                        <div class="billboard-badge">✦ Destaque &bull; ${filme.qualidade}</div>
                        <div class="billboard-title">${filme.titulo}</div>
                        <div class="billboard-meta">${filme.categoria}</div>
                        <div class="billboard-actions">
                            <button class="btn-billboard-play" onclick='abrirDetalhes(${JSON.stringify(filme).replace(/'/g, "&apos;")})'>▶ Assistir</button>
                            <button class="btn-billboard-fav" onclick='toggleFavoritoDireto(event, ${JSON.stringify(filme).replace(/'/g, "&apos;")}, this)'>${isFav ? '♥' : '♡'}</button>
                        </div>
                    </div>
                `;
                billboard.appendChild(slide);
            });

            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'billboard-dots';
            billboardSlides.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `b-dot ${idx === 0 ? 'active' : ''}`;
                dot.onclick = () => mudarSlideBillboard(idx);
                dotsContainer.appendChild(dot);
            });
            billboard.appendChild(dotsContainer);
            homeView.appendChild(billboard);
            iniciarRotacaoBillboard();

            const innerContainer = document.createElement('div');
            innerContainer.className = 'container';
            innerContainer.id = 'homeCategoriesContainer';

            const dynamicTopDiv = document.createElement('div');
            dynamicTopDiv.id = 'homeDynamicTop';
            innerContainer.appendChild(dynamicTopDiv);

            // Secção "Em Alta"
            const recSection = document.createElement('div');
            recSection.className = 'category-section';
            recSection.innerHTML = `<div class="category-header"><div class="category-title">Em Alta</div></div>`;
            const recCarousel = document.createElement('div');
            recCarousel.className = 'movies-carousel';
            let recomendados = [...listaFilmes].sort(() => 0.5 - Math.random()).slice(0, 12);
            recomendados.forEach(filme => { recCarousel.appendChild(criarCardClean(filme)); });
            recSection.appendChild(recCarousel);
            innerContainer.appendChild(recSection);

            for (const [categoria, itens] of Object.entries(categoriasMap)) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'category-section';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'category-header';
                headerDiv.innerHTML = `<div class="category-title">${categoria}</div>`;

                if (itens.length > 8) {
                    const btnMore = document.createElement('button');
                    btnMore.className = 'btn-see-more';
                    btnMore.textContent = `Ver Mais (${itens.length})`;
                    btnMore.onclick = () => selecionarAba(categoria);
                    headerDiv.appendChild(btnMore);
                }

                const carouselDiv = document.createElement('div');
                carouselDiv.className = 'movies-carousel';
                itens.slice(0, 8).forEach(filme => { carouselDiv.appendChild(criarCardClean(filme)); });

                if (itens.length > 8) {
                    const seeMoreCard = document.createElement('div');
                    seeMoreCard.className = 'see-more-card';
                    seeMoreCard.innerHTML = `<div class="see-more-text">Ver Mais</div><div style="font-size:10px; color:var(--text-secondary)">(${itens.length})</div>`;
                    seeMoreCard.onclick = () => selecionarAba(categoria);
                    carouselDiv.appendChild(seeMoreCard);
                }

                sectionDiv.appendChild(headerDiv);
                sectionDiv.appendChild(carouselDiv);
                innerContainer.appendChild(sectionDiv);
            }

            homeView.appendChild(innerContainer);
            homeJaRenderizada = true;
            atualizarSecoesDinamicasHome();
        }

        function atualizarSecoesDinamicasHome() {
            const dynamicTop = document.getElementById('homeDynamicTop');
            if (!dynamicTop) return;
            dynamicTop.innerHTML = '';

            if (favoritos.length > 0) {
                const favSection = document.createElement('div');
                favSection.className = 'category-section';
                favSection.innerHTML = `
                    <div class="category-header">
                        <div class="category-title">Favoritos</div>
                        <button class="btn-see-more" onclick="selecionarAba('Favoritos')">Ver Todos (${favoritos.length})</button>
                    </div>
                `;
                const favCarousel = document.createElement('div');
                favCarousel.className = 'movies-carousel';
                favoritos.slice(0, 8).forEach(filme => {
                    favCarousel.appendChild(criarCardClean(filme));
                });
                favSection.appendChild(favCarousel);
                dynamicTop.appendChild(favSection);
            }

            if (assistidosLista.length > 0) {
                const astSection = document.createElement('div');
                astSection.className = 'category-section';
                astSection.innerHTML = `
                    <div class="category-header">
                        <div class="category-title">Continuar Assistindo</div>
                        <button class="btn-see-more" onclick="selecionarAba('Recentes')">Ver Todos (${assistidosLista.length})</button>
                    </div>
                `;
                const astCarousel = document.createElement('div');
                astCarousel.className = 'movies-carousel';
                assistidosLista.slice(0, 8).forEach(filme => {
                    astCarousel.appendChild(criarCardClean(filme));
                });
                astSection.appendChild(astCarousel);
                dynamicTop.appendChild(astSection);
            }
        }

        function iniciarRotacaoBillboard() {
            clearInterval(billboardTimer);
            billboardTimer = setInterval(() => {
                let proximo = (billboardIndex + 1) % billboardSlides.length;
                mudarSlideBillboard(proximo);
            }, 6000);
        }

        function mudarSlideBillboard(idx) {
            billboardIndex = idx;
            const slides = document.querySelectorAll('.billboard-slide');
            const dots = document.querySelectorAll('.b-dot');
            slides.forEach((s, i) => s.classList.toggle('active', i === idx));
            dots.forEach((d, i) => d.classList.toggle('active', i === idx));
            iniciarRotacaoBillboard();
        }

        function toggleFavoritoDireto(event, filme, btnElem) {
            event.stopPropagation();
            const index = favoritos.findIndex(f => f.titulo === filme.titulo && f.url === filme.url);
            if (index > -1) {
                favoritos.splice(index, 1);
                btnElem.textContent = '♡';
                mostrarToast("Removido dos Favoritos");
            } else {
                favoritos.push(filme);
                btnElem.textContent = '♥';
                mostrarToast("Adicionado aos Favoritos!");
            }
            localStorage.setItem('freetv_favs', JSON.stringify(favoritos));
            construirAbas();
            atualizarSecoesDinamicasHome();
        }

        function abrirFilmeAleatorio() {
            if (listaFilmes.length === 0) return;
            const sorteado = listaFilmes[Math.floor(Math.random() * listaFilmes.length)];
            abrirDetalhes(sorteado);
        }

        function mostrarAvisoCatalogoVazio() {
            const homeView = document.getElementById('viewHome');
            homeView.innerHTML = `
                <div class="empty-catalog-box">
                    <div class="empty-catalog-icon">🎬</div>
                    <div class="empty-catalog-title">Catálogo em Expansão</div>
                    <div class="empty-catalog-text">O catálogo de filmes está a ser atualizado. Novos conteúdos serão adicionados em breve!</div>
                </div>
            `;
        }

        function renderizarListaEspecifica(titulo, itens, tipoLista) {
            const listView = document.getElementById('viewList');
            listView.innerHTML = '';

            const headerBar = document.createElement('div');
            headerBar.className = 'list-header-bar';
            headerBar.innerHTML = `
                <div class="nav-back-bar">
                    <button class="btn-back" onclick="selecionarAba('Todos')">Voltar</button>
                    <h2 style="font-size:17px; font-weight:700;">${titulo} (${itens.length})</h2>
                </div>
            `;

            if (tipoLista === 'recentes' && itens.length > 0) {
                const clearBtn = document.createElement('button');
                clearBtn.className = 'btn-clear-history';
                clearBtn.textContent = 'Limpar Recentes';
                clearBtn.onclick = limparHistoricoRecentes;
                headerBar.appendChild(clearBtn);
            } else if (tipoLista === 'favoritos' && itens.length > 0) {
                const clearBtn = document.createElement('button');
                clearBtn.className = 'btn-clear-history';
                clearBtn.textContent = 'Limpar Favoritos';
                clearBtn.onclick = limparHistoricoFavoritos;
                headerBar.appendChild(clearBtn);
            }

            listView.appendChild(headerBar);

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'movies-grid-wrapper';

            let itensExibicao = itens;
            if (itens.length > 120) {
                itensExibicao = itens.slice(0, 120);
            }

            const gridDiv = document.createElement('div');
            gridDiv.className = 'movies-grid-clean';

            if (!itens || itens.length === 0) {
                gridWrapper.innerHTML = '<div class="status-message">Nenhum item encontrado nesta lista.</div>';
                listView.appendChild(gridWrapper);
                return;
            }

            itensExibicao.forEach(filme => { gridDiv.appendChild(criarCardClean(filme)); });
            gridWrapper.appendChild(gridDiv);
            listView.appendChild(gridWrapper);
        }

        function criarCardClean(filme) {
            const card = document.createElement('div');
            card.className = 'movie-card-clean';
            
            const key = filme.titulo + filme.url;
            const progressoSeg = historicoProgresso[key] || 0;
            const jaAssistido = assistidosLista.some(f => f.titulo === filme.titulo && f.url === filme.url);
            
            let indicadorHtml = '';
            let barraProgressoHtml = '';

            if (jaAssistido) {
                indicadorHtml = `<div class="watched-dot" title="Assistido"></div>`;
            }

            if (progressoSeg > 5) {
                let pct = Math.min(100, (progressoSeg / 7200) * 100);
                barraProgressoHtml = `
                    <div class="card-progress-bar">
                        <div class="card-progress-fill" style="width: ${pct}%"></div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="poster-clean-wrapper">
                    <div class="quality-badge-clean">${filme.qualidade}</div>
                    ${indicadorHtml}
                    <img class="movie-clean-poster" alt="${filme.titulo}" loading="eager">
                    ${barraProgressoHtml}
                </div>
            `;

            const imgElem = card.querySelector('.movie-clean-poster');

            if (globalImageCache.has(filme.capa)) {
                imgElem.src = globalImageCache.get(filme.capa);
            } else {
                const tempImg = new Image();
                tempImg.src = filme.capa || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500';
                tempImg.onload = () => {
                    globalImageCache.set(filme.capa, tempImg.src);
                    imgElem.src = tempImg.src;
                };
                tempImg.onerror = () => {
                    imgElem.src = 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500';
                };
            }

            card.onclick = () => abrirDetalhes(filme);
            return card;
        }

        function limparHistoricoRecentes() {
            assistidosLista = [];
            historicoProgresso = {};
            localStorage.removeItem('freetv_watched_list');
            localStorage.removeItem('freetv_progress');
            atualizarTelaAtual();
            construirAbas();
            atualizarSecoesDinamicasHome();
        }

        function limparHistoricoFavoritos() {
            favoritos = [];
            localStorage.removeItem('freetv_favs');
            atualizarTelaAtual();
            construirAbas();
            atualizarSecoesDinamicasHome();
        }

        function toggleFavoritoAtual() {
            if (!filmeSelecionado) return;
            const index = favoritos.findIndex(f => f.titulo === filmeSelecionado.titulo && f.url === filmeSelecionado.url);
            
            if (index > -1) {
                favoritos.splice(index, 1);
                document.getElementById('btnFav').textContent = "Adicionar aos Favoritos";
            } else {
                favoritos.push(filmeSelecionado);
                document.getElementById('btnFav').textContent = "Remover dos Favoritos";
            }

            localStorage.setItem('freetv_favs', JSON.stringify(favoritos));
            construirAbas();
            atualizarSecoesDinamicasHome();
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('toastNotification');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        function copiarLinkSite() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                mostrarToast("Link copiado para a área de transferência!");
            }).catch(err => console.error(err));
        }

        function abrirDetalhes(filme) {
            filmeSelecionado = filme;
            document.getElementById('detTitulo').textContent = filme.titulo;
            document.getElementById('detCategoria').textContent = filme.categoria || 'Streaming';
            document.getElementById('detQualidade').textContent = filme.qualidade || 'HD';
            document.getElementById('detCapa').src = filme.capa || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500';

            const key = filme.titulo + filme.url;
            const progressoSalvo = historicoProgresso[key] || 0;
            const btnPlayText = document.getElementById('btnPlayAction');
            const noticeText = document.getElementById('detPlayerNotice');

            if (progressoSalvo > 10) {
                let min = Math.floor(progressoSalvo / 60);
                btnPlayText.textContent = `▶ Continuar de (${min} min)`;
                noticeText.textContent = `⏱ A reprodução será retomada de onde parou (${min} min).`;
            } else {
                btnPlayText.textContent = "▶ Reproduzir Agora";
                noticeText.textContent = "🎬 Toque abaixo para reproduzir o filme com o leitor cinematográfico integrado.";
            }

            const isFav = favoritos.some(f => f.titulo === filme.titulo && f.url === filme.url);
            document.getElementById('btnFav').textContent = isFav ? "Remover dos Favoritos" : "Adicionar aos Favoritos";

            document.getElementById('detailModal').classList.add('active');
        }

        function fecharDetalhes() { document.getElementById('detailModal').classList.remove('active'); }
        function fecharDetalhesFora(event) { if (event.target.id === 'detailModal') fecharDetalhes(); }

        function iniciarReproducaoNativa() {
            if (!filmeSelecionado) return;
            fecharDetalhes();

            const overlay = document.getElementById('videoPlayerOverlay');
            document.getElementById('videoPlayerTitle').textContent = filmeSelecionado.titulo;
            document.getElementById('hudQualityBadge').textContent = `${filmeSelecionado.qualidade || 'HD'} • FREETV`;
            document.getElementById('playerAmbientBg').src = filmeSelecionado.capa || '';

            videoElem.src = filmeSelecionado.url;
            overlay.classList.add('active');

            const key = filmeSelecionado.titulo + filmeSelecionado.url;
            const tempoSalvo = historicoProgresso[key] || 0;

            videoElem.onloadedmetadata = () => {
                if (tempoSalvo > 5) {
                    videoElem.currentTime = tempoSalvo;
                }
            };
            
            videoElem.play().then(() => {
                document.getElementById('btnHudPlay').textContent = '❚❚';
            }).catch(() => {
                document.getElementById('btnHudPlay').textContent = '▶';
            });

            iniciarGravacaoProgresso();
            mostrarHudTemporariamente();
        }

        function iniciarGravacaoProgresso() {
            clearInterval(salvarProgressoInterval);
            salvarProgressoInterval = setInterval(() => {
                if (!videoElem.paused && filmeSelecionado) {
                    const key = filmeSelecionado.titulo + filmeSelecionado.url;
                    historicoProgresso[key] = videoElem.currentTime;
                    localStorage.setItem('freetv_progress', JSON.stringify(historicoProgresso));

                    if (videoElem.currentTime > 15) {
                        const jaExisteIndex = assistidosLista.findIndex(f => f.titulo === filmeSelecionado.titulo && f.url === filmeSelecionado.url);
                        if (jaExisteIndex > -1) {
                            assistidosLista.splice(jaExisteIndex, 1);
                        }
                        assistidosLista.unshift(filmeSelecionado);
                        localStorage.setItem('freetv_watched_list', JSON.stringify(assistidosLista));
                    }
                }
            }, 3000);
        }

        function alternarPlayPause() {
            if (videoElem.paused) { videoElem.play(); document.getElementById('btnHudPlay').textContent = '❚❚'; }
            else { videoElem.pause(); document.getElementById('btnHudPlay').textContent = '▶'; }
            mostrarHudTemporariamente();
        }

        function pularTempo(segundos) {
            videoElem.currentTime = Math.max(0, Math.min(videoElem.duration || 0, videoElem.currentTime + segundos));
            mostrarHudTemporariamente();
        }

        function arrastarProgresso() {
            if (videoElem.duration) { videoElem.currentTime = (hudSlider.value / 100) * videoElem.duration; }
            mostrarHudTemporariamente();
        }

        videoElem.addEventListener('timeupdate', () => {
            if (videoElem.duration) {
                hudSlider.value = (videoElem.currentTime / videoElem.duration) * 100;
                document.getElementById('hudCurrentTime').textContent = formatarTempo(videoElem.currentTime);
                document.getElementById('hudDuration').textContent = formatarTempo(videoElem.duration);
            }
        });

        function formatarTempo(seg) {
            if (isNaN(seg)) return "00:00";
            const h = Math.floor(seg / 3600);
            const m = Math.floor((seg % 3600) / 60);
            const s = Math.floor(seg % 60);
            if (h > 0) return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function mostrarHudTemporariamente() {
            customHud.classList.remove('hidden-hud');
            clearTimeout(hudTimer);
            hudTimer = setTimeout(() => { if (!videoElem.paused) customHud.classList.add('hidden-hud'); }, 3500);
        }

        function alternarVisibilidadeHud(event) {
            if (event.target.closest('button') || event.target.tagName === 'INPUT') return;
            if (customHud.classList.contains('hidden-hud')) mostrarHudTemporariamente();
            else customHud.classList.add('hidden-hud');
        }

        function fecharPlayerNativo() {
            clearInterval(salvarProgressoInterval);
            if (videoElem && filmeSelecionado) {
                const key = filmeSelecionado.titulo + filmeSelecionado.url;
                historicoProgresso[key] = videoElem.currentTime;
                localStorage.setItem('freetv_progress', JSON.stringify(historicoProgresso));
            }
            videoElem.pause(); 
            videoElem.src = "";
            document.getElementById('videoPlayerOverlay').classList.remove('active');
            construirAbas();
            atualizarSecoesDinamicasHome();
        }

        function mostrarHistoricoPesquisa() {
            if (historicoPesquisas.length === 0) return;
            const dropdown = document.getElementById('searchHistoryDropdown');
            const list = document.getElementById('searchHistoryList');
            list.innerHTML = '';

            historicoPesquisas.forEach(termo => {
                const tag = document.createElement('div');
                tag.className = 'search-tag';
                tag.textContent = termo;
                tag.onclick = () => {
                    document.getElementById('searchInput').value = termo;
                    fecharHistoricoPesquisa();
                    executarPesquisa(termo.toLowerCase());
                };
                list.appendChild(tag);
            });

            dropdown.classList.add('active');
        }

        function fecharHistoricoPesquisa() {
            document.getElementById('searchHistoryDropdown').classList.remove('active');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                fecharHistoricoPesquisa();
            }
        });

        function salvarTermoPesquisa(termoOriginal) {
            const limpo = termoOriginal.trim();
            if (limpo.length < 2) return;
            historicoPesquisas = historicoPesquisas.filter(t => t.toLowerCase() !== limpo.toLowerCase());
            historicoPesquisas.unshift(limpo);
            if (historicoPesquisas.length > 8) historicoPesquisas.pop();
            localStorage.setItem('freetv_search_history', JSON.stringify(historicoPesquisas));
        }

        function limparHistoricoPesquisa() {
            historicoPesquisas = [];
            localStorage.removeItem('freetv_search_history');
            fecharHistoricoPesquisa();
            mostrarToast("Histórico de pesquisa limpo!");
        }

        function dispararBuscaComDelay() {
            clearTimeout(tempoBusca);
            const rawVal = document.getElementById('searchInput').value;
            const termo = rawVal.toLowerCase().trim();
            if (!termo) { 
                selecionarAba('Todos'); 
                return; 
            }
            tempoBusca = setTimeout(() => { 
                salvarTermoPesquisa(rawVal);
                fecharHistoricoPesquisa();
                executarPesquisa(termo); 
            }, 650);
        }

        function executarPesquisa(termo) {
            if (abaAtiva === 'Todos') scrollPosAnterior = window.scrollY;
            mostrarView('viewList');
            let filtrados = listaFilmes.filter(filme => filme.titulo.toLowerCase().includes(termo));
            if (ordemAZ) filtrados.sort((a, b) => a.titulo.localeCompare(b.titulo));
            renderizarListaEspecifica(`Pesquisa: "${termo}"`, filtrados, null);
        }

        carregarFilmes();
    </script>
</body>
</html>
