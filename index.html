<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MG Filmes - Teste MP4</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { padding: 16px; background: #111827; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        header h1 { font-size: 18px; color: #38bdf8; font-weight: 700; }

        .player-container { width: 100%; background: #000; position: sticky; top: 0; z-index: 10; }
        video { width: 100%; max-height: 40vh; display: block; background: #000; outline: none; }

        .catalog { padding: 16px; flex: 1; }
        .catalog h2 { font-size: 15px; color: #9ca3af; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

        .movie-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        .movie-card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .movie-card:active { transform: scale(0.97); }
        
        .movie-thumb { width: 100%; height: 130px; object-fit: cover; background: #1f2937; }
        .movie-info { padding: 10px; }
        .movie-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-year { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 MG Filmes - Player MP4</h1>
    </header>

    <div class="player-container">
        <video id="videoPlayer" controls playsinline autoplay></video>
    </div>

    <div class="catalog">
        <h2>Catálogo de Teste</h2>
        <div class="movie-grid" id="movieGrid">
            <!-- Os filmes entram aqui via JavaScript -->
        </div>
    </div>

    <script>
        // Lista de filmes de teste usando links .mp4 públicos, seguros (HTTPS) e abertos
        const filmes = [
            {
                titulo: "Big Buck Bunny",
                ano: "2008",
                capa: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Big_Buck_Bunny_poster_big.jpg/800px-Big_Buck_Bunny_poster_big.jpg",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
            },
            {
                titulo: "Elephant Dream",
                ano: "2006",
                capa: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Elephants_Dream_poster.jpg/800px-Elephants_Dream_poster.jpg",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
            },
            {
                titulo: "For Bigger Blazes",
                ano: "2024",
                capa: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
            },
            {
                titulo: "Subaru Outback",
                ano: "2024",
                capa: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=500",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackSeeTheWorld.mp4"
            }
        ];

        function carregarCatalogo() {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            filmes.forEach((filme, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img class="movie-thumb" src="${filme.capa}" alt="${filme.titulo}">
                    <div class="movie-info">
                        <div class="movie-title">${filme.titulo}</div>
                        <div class="movie-year">${filme.ano}</div>
                    </div>
                `;

                card.onclick = () => {
                    tocarFilme(filme.url, filme.titulo);
                };

                grid.appendChild(card);
            });

            // Toca o primeiro por padrão
            if (filmes.length > 0) {
                tocarFilme(filmes[0].url, filmes[0].titulo);
            }
        }

        function tocarFilme(url, titulo) {
            const video = document.getElementById('videoPlayer');
            video.src = url;
            video.play().catch(err => {
                console.log("Autoplay bloqueado pelo navegador:", err);
            });
        }

        carregarCatalogo();
    </script>
</body>
</html>
