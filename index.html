<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 25px;
            max-width: 340px;
            width: 85%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: #38bdf8;
        }
        p {
            color: #cbd5e1;
            line-height: 1.5;
            font-size: 15px;
        }
        button {
            margin-top: 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        #mensagem {
            margin-top: 15px;
            font-weight: bold;
            color: #4ade80;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Site Online! 🚀</h1>
        <p>Hospedado gratuitamente no GitHub Pages direto pelo celular.</p>
        <button onclick="testar()">Testar Botão</button>
        <div id="mensagem"></div>
    </div>

    <script>
        function testar() {
            document.getElementById('mensagem').innerText = 'Funcionando perfeitamente!';
        }
    </script>

</body>
</html>
